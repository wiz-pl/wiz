# Wiz CI. See "Continuous integration" in docs/building.md.
#
# Runs on `master` (the integration branch, with the solutions in it) and on pull
# requests into it: the full suite, split into shards (.github/test-shards.json). The
# toolchain is built once, with Nix (`nix build .#wiz .#tests`), and a push to master
# publishes it to the trusted Cachix cache (a pull request publishes only to its own
# untrusted PR cache); the test shards substitute those store paths instead of rebuilding
# (no Lake build and no `.lake` Actions cache on the critical path). The exercise tree
# (scripts/mkexercises.py) is checked only when a release is tagged: release.yml's
# `exercise tree` job, which must pass before anything is published (it still builds
# with Lake, as does the weekly fixpoint).
name: CI

on:
  push:
    branches: [master]  # agent branches are tested through their PRs
  pull_request:
    branches: [master]
  # the merge queue (docs/building.md, "Merging"): each queued PR is tested merged onto
  # master and the PRs ahead of it, and lands only if this run's `CI result` passes
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "23 2 * * 1" # Mondays: the bootstrap fixpoint check
  workflow_dispatch:
    inputs:
      fixpoint:
        description: Also run the bootstrap fixpoint check (slow)
        type: boolean
        default: false

# A newer push supersedes an older run of the same ref (saves runners): on a pull
# request, and on master too, where merges come in quick succession and every run
# tests everything merged so far (the newest run covers the older commits' changes;
# nightly.yml then moves to the newest green commit; release.yml has its own rule). A
# merge queue entry has a ref of its own (gh-readonly-queue/master/pr-N-SHA) and is
# never cancelled by this rule (the queue cancels it when the entry leaves the queue);
# a manual run has a group of its own.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'schedule' && 'fixpoint' || 'checks' }}${{ github.event_name == 'workflow_dispatch' && format('-dispatch-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions:
  contents: read

env:
  # The trusted Cachix binary cache (empty: none, everything comes from
  # cache.nixos.org). Only a push to master publishes to it; pulls (and the docs/tower
  # path) read it anonymously. A pull request publishes only to its own untrusted cache,
  # named by the repository variable CACHIX_PR_NAME and authenticated by the secret
  # CACHIX_PR_AUTH_TOKEN; without that token it publishes nothing, and its shards build
  # the paths themselves. See docs/ci-runner.md, "Which cache is trusted".
  CACHIX_NAME: badlydrawnwizards
  # The PR cache's name comes from repository settings (CACHIX_PR_NAME), never a literal
  # here: it is untrusted and must never be added to trusted-public-keys.
  CACHIX_PR_NAME: ${{ vars.CACHIX_PR_NAME }}
  # Lake's artifact cache (enableArtifactCache in lakefile.lean) inside .lake rather than
  # under the elan toolchain. Only the jobs that still run Lake use it: the weekly
  # fixpoint (and release.yml, which has its own workflow).
  LAKE_CACHE_DIR: ${{ github.workspace }}/.lake/cache

defaults:
  run:
    shell: nix develop --command bash -eo pipefail {0}

jobs:
  # Path filters: which jobs a pull request needs (scripts/ci.py changes; the shards'
  # "inputs" in .github/test-shards.json). A docs-only PR builds no shard and runs no
  # test, but it does check the documentation's Wiz examples (docs_examples); a PR
  # touching only lib/ files no core test reads skips the core shard; the selfhost
  # shards run for selfhost/ and the lib/ files it imports. Everything but a
  # pull_request (pushes, the merge queue, manual runs) runs every job.
  changes:
    name: changes
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
      shards: ${{ steps.filter.outputs.shards }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2 # a pull request's merge commit and its first parent (the base)
      - name: What changed
        id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD | sed 's/^/  /'
            python3 scripts/ci.py changes HEAD^1 HEAD >> "$GITHUB_OUTPUT"
          else
            python3 scripts/ci.py changes --all >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  # (seconds, no build) Documentation style: no authoring-environment paths, no
  # agent roles and no status checkmarks (scripts/check-docs-style.py). Runs on
  # every pull request too, including docs-only ones, which build and test skip.
  docs_style:
    name: docs style
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check the docs, and the checker's fixtures
        shell: bash
        run: |
          python3 scripts/check-docs-style.py --self-test
          python3 scripts/check-docs-style.py

  # The Wiz snippets in docs/**/*.md (scripts/check-docs-examples.py). A docs-only
  # pull request has no `build` job, so this one substitutes `wiz` from Cachix (the
  # same store path `build` publishes) and checks the snippets. A pull request reads
  # the trusted cache anonymously; it never gets its auth token.
  docs_examples:
    name: docs examples
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.code == 'false' && needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup
        with:
          cachix-name: ${{ env.CACHIX_NAME }}
          cachix-token: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && secrets.CACHIX_AUTH_TOKEN || '' }}
          lean: false
      - name: Cache key
        id: key
        shell: bash
        run: |
          echo "compiler=${{ hashFiles('flake.lock', 'flake.nix', 'lean-toolchain', 'lake-manifest.json', 'lakefile.lean', '**/*.lean', 'runtime/**', 'c/**') }}" >> "$GITHUB_OUTPUT"
      - name: nix build wiz (substituted from Cachix)
        id: nix
        shell: bash
        run: |
          nix build .#wiz --no-link -L
          wiz=$(nix path-info .#wiz)
          echo "wiz=$wiz" >> "$GITHUB_OUTPUT"
          "$wiz/bin/wiz" --version
      - name: Restore the docs examples cache
        id: docs-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/docs-examples
          key: docs-examples-${{ runner.os }}-${{ steps.key.outputs.compiler }}
          restore-keys: docs-examples-${{ runner.os }}-
      - name: Check the docs examples
        # the default shell is the dev shell: `wiz run` blocks need `cc` and GMP
        run: |
          python3 scripts/check-docs-examples.py --self-test
          python3 scripts/check-docs-examples.py --wiz "${{ steps.nix.outputs.wiz }}/bin/wiz"

  build:
    name: build
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # one cold Nix build (unwrapped + prewarm), then the Cachix push of ~1.8 GB
    timeout-minutes: 90
    outputs:
      tree: solution # only the summary's title reads it (there is one tree now)
      matrix: ${{ steps.shards.outputs.matrix }}
      # what identifies the compiler and test driver (and the C toolchain they use); the
      # test shards key their Wiz build caches on it
      compiler-key: ${{ steps.key.outputs.compiler }}
      # the store paths of this commit's build (the shards substitute them from Cachix)
      wiz: ${{ steps.nix.outputs.wiz }}
      tests: ${{ steps.nix.outputs.tests }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup
        with:
          cachix-name: ${{ env.CACHIX_NAME }}
          # Only a push to master gets the trusted token: pulls, merge-queue runs and
          # dispatch read the public cache anonymously.
          cachix-token: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && secrets.CACHIX_AUTH_TOKEN || '' }}
          # no Lake here: nixpkgs' Lean builds the packages (elan is only for the
          # fixpoint)
          lean: false
      - name: Cache key
        id: key
        shell: bash
        run: |
          # what identifies the compiler and test driver (and the C toolchain they use)
          echo "compiler=${{ hashFiles('flake.lock', 'flake.nix', 'lean-toolchain', 'lake-manifest.json', 'lakefile.lean', '**/*.lean', 'runtime/**', 'c/**') }}" >> "$GITHUB_OUTPUT"
      - name: nix build (wiz, grail and the test driver)
        id: nix
        run: |
          # One build for every job: the shards substitute these store paths (master's
          # from the trusted cache; a pull request's from its PR cache when published).
          # `packages.wiz` is the default package; `packages.tests` is the test driver,
          # from the same build.
          nix build .#wiz .#tests --no-link -L
          # No .#reference here: only the docs job reads it (and only on a push), and no
          # shard waits on it. That job builds it from this cached wiz, off this path.
          wiz=$(nix path-info .#wiz)
          tests=$(nix path-info .#tests)
          echo "wiz=$wiz" >> "$GITHUB_OUTPUT"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          echo "wiz: $wiz"; echo "tests: $tests"
          du -sh "$wiz" "$tests"
          nix path-info -S "$wiz" "$tests" | sed 's/^/closure: /'
      - name: The trusted base matches the baseline (before any shard runs)
        # Fast fail: a ledger regression stops the run here, before the 1.8 GB Cachix
        # push and before any test shard starts, and it reuses the store path this job
        # already built instead of a separate job that builds again (~6 min).
        run: |
          mkdir -p .lake/build/bin
          ln -sf "${{ steps.nix.outputs.tests }}/bin/tests" .lake/build/bin/tests
          scripts/trust-ledger.sh --check --strict-legacy
          Tests/trust-ledger/run.sh
          scripts/trust-ledger-merge_test.sh
          python3 scripts/host-unsafe-ledger.py --check
          Tests/host-unsafe-ledger/run.sh
      - name: Publish the store paths to Cachix (master)
        # Only a push to master writes the trusted cache. The token is in this step's
        # environment only; nothing on a pull request can reach it.
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -z "$CACHIX_AUTH_TOKEN" ]; then
            echo "::warning title=Cachix::no CACHIX_AUTH_TOKEN: the store paths are not published"
            exit 0
          fi
          # .#reference is built by the docs job, not here (#460), so it is not pushed.
          nix develop .#ci --command env CACHIX_AUTH_TOKEN="$CACHIX_AUTH_TOKEN" cachix push "$CACHIX_NAME" \
            $(nix path-info .#wiz .#tests)
      - name: Publish the store paths to the PR cache
        # A pull request writes only its own untrusted cache, with its own token. If the
        # repository variable or secret is absent (or this is a fork), nothing is
        # published: the shards build the paths, and nothing falls back to the trusted
        # cache or its token.
        if: github.event_name == 'pull_request'
        env:
          CACHIX_PR_AUTH_TOKEN: ${{ secrets.CACHIX_PR_AUTH_TOKEN }}
        run: |
          if [ -z "$CACHIX_PR_NAME" ] || [ -z "$CACHIX_PR_AUTH_TOKEN" ]; then
            echo "::warning title=Cachix::no CACHIX_PR_AUTH_TOKEN: the store paths are not published (set the CACHIX_PR_NAME variable and the CACHIX_PR_AUTH_TOKEN secret)"
            exit 0
          fi
          nix develop .#ci --command env CACHIX_AUTH_TOKEN="$CACHIX_PR_AUTH_TOKEN" cachix push "$CACHIX_PR_NAME" \
            $(nix path-info .#wiz .#tests)
      - name: Every test case is in exactly one shard
        run: python3 scripts/ci.py check-shards "${{ steps.nix.outputs.tests }}/bin/tests"
      - name: Shards
        id: shards
        run: |
          # a shard with "split" becomes several, balanced by .github/test-timings.json
          # only the shards this change needs (all of them outside pull requests)
          echo "matrix=$(python3 scripts/ci.py matrix --only '${{ needs.changes.outputs.shards }}' '${{ steps.nix.outputs.tests }}/bin/tests')" >> "$GITHUB_OUTPUT"
          python3 scripts/ci.py plan "${{ steps.nix.outputs.tests }}/bin/tests"
      - name: The runtime compiles on its own
        # cc -fsyntax-only -Wall -Wextra, with WIZ_API= (the object ABI) and WIZ_API=static
        # (a generated program); the header's prototypes are checked against the parts.
        # (`scripts/test-embed.sh`, which needs an incremental Lake build, is a local
        # dev-shell check now: `nix develop -c scripts/test-embed.sh`.)
        run: scripts/test-runtime.sh
      - name: The example index validates offline
        # stage 23m: entries, archive SHA-256s, semver ranges, module-prefix conflicts and
        # index.wiz; no network (the sources are relative paths). `grail` comes from the
        # store path this job built (the `build` job has no Lake and no PATH entry).
        env:
          GRAIL: ${{ steps.nix.outputs.wiz }}/bin/grail
        run: scripts/grail-index-check.sh examples/grail-index
      - name: The package checks, builds and runs a program outside the checkout
        # what the old `package` job tested, after the one build: a program is checked and
        # built from a directory with no checkout, and grail starts
        run: |
          dir=$(mktemp -d)
          cp examples/io.wiz "$dir/"
          cd "$dir"
          nix run "$GITHUB_WORKSPACE#wiz" -- check io.wiz
          nix run "$GITHUB_WORKSPACE#wiz" -- build io.wiz -o io
          ./io | head -3
          nix run "$GITHUB_WORKSPACE#grail" -- 2>&1 | head -2
      - name: Reproducibility (two absolute paths)
        # generated C, binaries, .split/, -g debug info, LLVM output and the .grail tree
        # must be byte-identical under different PWD/HOME/TMPDIR/umask/locale/epoch/-j.
        env:
          WIZ: ${{ steps.nix.outputs.wiz }}/bin/wiz
          GRAIL: ${{ steps.nix.outputs.wiz }}/bin/grail
        run: scripts/check-repro.sh --json
      - name: Restore the docs examples cache
        id: docs-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/docs-examples
          key: docs-examples-${{ runner.os }}-${{ steps.key.outputs.compiler }}
          restore-keys: docs-examples-${{ runner.os }}-
      - name: Check the docs examples
        # the Wiz blocks in docs/**/*.md; a code change can stale one even without a
        # docs change, so every build checks them (seconds on a warm cache).  The
        # default shell is the dev shell, which `wiz run` blocks need for `cc` and GMP.
        run: |
          python3 scripts/check-docs-examples.py --self-test
          python3 scripts/check-docs-examples.py --wiz "${{ steps.nix.outputs.wiz }}/bin/wiz"
      - name: Save the docs examples cache (master)
        if: steps.docs-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/docs-examples
          key: docs-examples-${{ runner.os }}-${{ steps.key.outputs.compiler }}

  test:
    name: test (${{ matrix.shard.name }})
    needs: [changes, build]
    if: needs.changes.outputs.shards != '[]'
    # A "heavy" shard (.github/test-shards.json) runs on the self-hosted runner whose
    # label is the repository variable WIZ_RUNNER_HEAVY (docs/ci-runner.md), when that is
    # set and the code is this repository's: a pull request from a fork never runs there
    # (it would run untrusted code on that machine) and uses GitHub's runner instead.
    # Unset (the default): every shard on ubuntu-latest, as before.
    runs-on: ${{ matrix.shard.heavy && vars.WIZ_RUNNER_HEAVY != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.WIZ_RUNNER_HEAVY || 'ubuntu-latest' }}
    timeout-minutes: 90 # the selfhost group is split into parts (test-shards.json) to keep each one short
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup
        with:
          cachix-name: ${{ env.CACHIX_NAME }}
          # Only a push to master gets the trusted token: pulls, merge-queue runs and
          # dispatch read the public cache anonymously.
          cachix-token: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && secrets.CACHIX_AUTH_TOKEN || '' }}
          # A pull request adds its own untrusted cache as a second substituter for this
          # job (its key is trusted here only); master never adds it.
          cachix-pr-name: ${{ github.event_name == 'pull_request' && env.CACHIX_PR_NAME || '' }}
          cachix-pr-token: ${{ github.event_name == 'pull_request' && secrets.CACHIX_PR_AUTH_TOKEN || '' }}
          # the tower group's "from source" case runs Lake, so that one shard needs the
          # elan toolchain (the others run only the store's binaries)
          lean: ${{ contains(toJSON(matrix.shard), 'tower') }}
      # The build job's store paths, substituted from Cachix (same os/arch): master's
      # from the trusted cache, a pull request's from its PR cache when it was published.
      # A fork, or a PR with no PR token, builds them again here.
      - name: nix build (the store paths, from Cachix)
        id: nix
        run: |
          nix build .#wiz .#tests --no-link -L
          wiz=$(nix path-info .#wiz)
          tests=$(nix path-info .#tests)
          echo "wiz=$wiz" >> "$GITHUB_OUTPUT"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          # the suite and its helpers name the checkout's binaries (`.lake/build/bin/wiz`,
          # `.lake/build/bin/grail`, `scripts/trust-ledger.sh`); point them at the store.
          # No Lake build and no .lake cache: this is a directory of symlinks.
          mkdir -p .lake/build/bin
          ln -sf "$wiz/bin/wiz" .lake/build/bin/wiz
          ln -sf "$wiz/bin/grail" .lake/build/bin/grail
          ln -sf "$tests/bin/tests" .lake/build/bin/tests
          echo "$wiz/bin" >> "$GITHUB_PATH"
          du -sh "$wiz" "$tests"
      # What the suite builds from Wiz programs, kept between runs: the elaboration cache
      # (`--cache`, which the grail-selfhost test uses), grail's `.grail` (the test's
      # build of the self-hosted checker) and the self-hosted checker and compiler that
      # Tests/Elab.lean compiles under /tmp. The elaboration cache's keys include the wiz
      # binary's hash, but the test runner's grail key has a constant binary id and the
      # /tmp programs a timestamp, so the key starts with the compiler's inputs and
      # restore-keys never cross compilers; within one compiler, entries are
      # content-addressed, so a partial hit (other Wiz files) is safe.
      - name: Restore the Wiz build caches
        id: wiz-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/wiz
            .grail
            /tmp/wiz-selfhost-*
          key: wiz-${{ runner.os }}${{ runner.arch != 'X64' && format('-{0}', runner.arch) || '' }}-${{ matrix.shard.name }}-${{ needs.build.outputs.compiler-key }}-${{ hashFiles('**/*.wiz') }}
          restore-keys: wiz-${{ runner.os }}${{ runner.arch != 'X64' && format('-{0}', runner.arch) || '' }}-${{ matrix.shard.name }}-${{ needs.build.outputs.compiler-key }}-
      - name: tests -- ${{ matrix.shard.name }}
        env:
          SELECT: ${{ matrix.shard.select }}
          JOBS: ${{ matrix.shard.jobs }}
        run: |
          mapfile -t sel <<< "$SELECT"
          mkdir -p logs ~/.cache/wiz
          du -sh ~/.cache/wiz .grail /tmp/wiz-selfhost-* 2>/dev/null || true
          echo "tests -- --cache ~/.cache/wiz --jobs $JOBS ${sel[*]}"
          # the Nix-built driver, exactly as `lake test -- …` would run it; every case's
          # time as JSON lines (scripts/ci.py summary and baseline read them)
          "${{ steps.nix.outputs.tests }}/bin/tests" --cache "$HOME/.cache/wiz" --jobs "$JOBS" \
            --timings "logs/${{ matrix.shard.name }}.jsonl" \
            --shard "${{ matrix.shard.name }}" "${sel[@]}" 2>&1 | tee "logs/${{ matrix.shard.name }}.log"
      - name: Save the Wiz build caches
        if: always() && steps.wiz-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/wiz
            .grail
            /tmp/wiz-selfhost-*
          key: wiz-${{ runner.os }}${{ runner.arch != 'X64' && format('-{0}', runner.arch) || '' }}-${{ matrix.shard.name }}-${{ needs.build.outputs.compiler-key }}-${{ hashFiles('**/*.wiz') }}
      - name: Summary
        if: always()
        run: |
          [ -f "logs/${{ matrix.shard.name }}.log" ] || exit 0
          shopt -s nullglob
          python3 scripts/ci.py summary "shard ${{ matrix.shard.name }}" logs/${{ matrix.shard.name }}.log logs/${{ matrix.shard.name }}.jsonl >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-log-${{ matrix.shard.name }}
          path: logs/
          if-no-files-found: ignore
          # always uploaded (the `CI result` job sums them up), but kept briefly
          retention-days: 3

  # (11s) The published site, as the artifact `wiz-docs`: on master only (a push), kept
  # 3 days (artifact storage). The tree is the landing page at the root, the standard
  # library's documentation (`wiz doc`, scroll) under `docs/`, and the static playground
  # under `playground/`; the two Wasm modules make the docs' signatures interactive and
  # run the playground. Not a required check (not in `result`); `deploy-docs` publishes
  # it to GitHub Pages on the same push (docs/building.md, "Documentation site").
  docs:
    name: docs (wiz doc --lib + site)
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup
        with:
          cachix-name: ${{ env.CACHIX_NAME }}
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          lean: false
      - name: nix build (wiz, from Cachix)
        id: nix
        run: |
          wiz=$(nix build .#wiz --no-link --print-out-paths)
          echo "wiz=$wiz" >> "$GITHUB_OUTPUT"
          du -sh "$wiz"
      - name: The Wasm modules (web/build.sh, web/build-playground.sh)
        env:
          WIZ: ${{ steps.nix.outputs.wiz }}/bin/wiz
        run: |
          sh web/build.sh web/out
          sh web/build-playground.sh web/out
      - name: wiz doc --lib
        run: |
          "${{ steps.nix.outputs.wiz }}/bin/wiz" doc --lib -o doc-site/docs --web web/out \
            --source-url "https://github.com/${{ github.repository }}/blob/${{ github.sha }}/lib/"
          ls doc-site/docs | head -50
      - name: The reference manual's Markdown (nix build .#reference)
        # Built here, not in the `build` job: this is the only consumer, and only a push
        # runs this job, so it is off the shards' critical path. It is generated from the
        # `wiz` the build job published (a substitute), so it needs no rebuild of wiz.
        run: |
          ref=$(nix build .#reference --no-link --print-out-paths)
          cp "$ref/index.md" doc-site/docs/reference.md
      - name: The landing page and the playground (web/build-site.sh)
        run: sh web/build-site.sh doc-site web/out
      - name: The site has its three entry points and the landing's links resolve
        run: sh web/check-site.sh doc-site
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wiz-docs
          path: doc-site
          retention-days: 3

  # (11s) Publish the `wiz-docs` artifact to GitHub Pages. The artifact's tree, and so
  # the site's URL layout, is:
  #   https://wiz-pl.github.io/wiz/                     the landing page (web/landing/)
  #   https://wiz-pl.github.io/wiz/docs/                the docs index (wiz doc's index.html)
  #   https://wiz-pl.github.io/wiz/docs/api.html        the API index (every declaration)
  #   https://wiz-pl.github.io/wiz/docs/Prelude.html    one page per module, plus A.B.json
  #   https://wiz-pl.github.io/wiz/playground/          the static playground (stage 11ab)
  # Every link is relative, so the same tree works at the project-site prefix above and
  # at a custom domain root.
  # A repository has ONE Pages site and every deployment replaces the whole tree, so this
  # job is the only Pages publisher. The performance site (when it lands) goes under
  # `/perf/` in the same artifact: build it into `doc-site/perf` in the `docs` job, or
  # add it here with a checkout, rather than enabling a second deploy job (which would
  # delete the site). The repository's Pages source must be "GitHub Actions" once
  # (Settings -> Pages; docs/building.md, "Documentation site"); until then this job
  # fails and the site keeps its last published tree. It is not in `result`: a Pages
  # outage does not fail the suite.
  deploy-docs:
    name: deploy docs to Pages
    needs: docs
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # deployments are serialised: `cancel-in-progress: false` lets an older deploy finish
    # and the newer one replace it, so the site ends at the newest master commit
    concurrency:
      group: pages
      cancel-in-progress: false
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: wiz-docs
          path: doc-site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: doc-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  # One check for branch protection, and the whole suite's summary.
  result:
    name: CI result
    needs: [changes, docs_style, docs_examples, build, test]
    if: always() && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          sparse-checkout: |
            scripts
            .github
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        if: needs.test.result != 'skipped' # no shard ran: nothing to sum up
        with:
          pattern: test-log-*
          path: logs
          merge-multiple: true
      - name: Summary
        if: needs.test.result != 'skipped' # no shard ran: nothing to sum up
        shell: bash
        run: |
          shopt -s nullglob
          logs=(logs/*.log logs/*.jsonl)
          python3 scripts/ci.py summary "Wiz test suite (${{ needs.build.outputs.tree }} tree)" "${logs[@]}" >> "$GITHUB_STEP_SUMMARY"
          # all shards' case times in one file, for `scripts/ci.py baseline`
          mkdir -p timings
          cat logs/*.jsonl > timings/timings.jsonl 2>/dev/null || true
      # A green run must have tested something. Fails when a group skipped wholesale
      # (unless .github/skip-allowlist.json allows it, with a reason and an owner), when
      # a skip names a tool the dev shell must provide (cc, GMP, GC, yosys, node, nix,
      # …), or when a group's unexplained skipped ratio (over its cases in every shard) is over 25%. The self-test runs
      # first, so the rule itself is checked on synthetic logs without the suite.
      - name: Skips are explained
        if: needs.test.result != 'skipped'
        shell: bash
        run: |
          python3 scripts/ci.py check-skips --self-test
          shopt -s nullglob
          logs=(logs/*.log logs/*.jsonl)
          if [ ${#logs[@]} -eq 0 ]; then
            echo "::error title=Skips::no test logs: a green run that wrote no test log tested nothing"
            exit 1
          fi
          python3 scripts/ci.py check-skips "${logs[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.test.result != 'skipped' # no shard ran: nothing to sum up
        with:
          name: test-timings
          path: timings/timings.jsonl
          if-no-files-found: ignore
          # master's feed `scripts/ci.py baseline` (docs/building.md); others are short-lived
          retention-days: ${{ github.event_name == 'push' && 7 || 2 }}
      # The shards stay balanced (docs/building.md, "Shard balance"): warn, never fail, when
      # the longest shard is over 1.5x the median, a split shard's cases are missing from
      # the baseline, or two parts build the same program. On master, a run whose tests all
      # passed and that drifted uploads the regenerated baseline (`test-timings-baseline`).
      - name: Shard balance
        id: balance
        if: needs.test.result != 'skipped' # no shard ran: nothing to sum up
        continue-on-error: true
        shell: bash
        run: |
          shopt -s nullglob
          rm -f test-timings.json
          python3 scripts/ci.py balance --factor 1.5 --baseline-out test-timings.json logs/*.jsonl >> "$GITHUB_STEP_SUMMARY"
          if [ -f test-timings.json ] && [ "${{ github.event_name }}" = push ] && [ "${{ needs.test.result }}" = success ]; then
            echo "refresh=true" >> "$GITHUB_OUTPUT"
            cmd="gh run download ${{ github.run_id }} -R ${{ github.repository }} -n test-timings-baseline -D .github"
            echo "::warning title=Shard balance::the test-timings baseline drifted; to apply this run's: $cmd"
            { echo; echo "To apply it (then commit .github/test-timings.json in a PR):"; echo; echo '```'; echo "$cmd"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.balance.outputs.refresh == 'true'
        with:
          name: test-timings-baseline
          path: test-timings.json
          retention-days: 7
      - name: Verdict
        shell: bash
        run: |
          echo "changes: ${{ needs.changes.result }} (code: ${{ needs.changes.outputs.code }}, docs: ${{ needs.changes.outputs.docs }}, shards: ${{ needs.changes.outputs.shards }})"
          echo "docs style: ${{ needs.docs_style.result }}"
          echo "docs examples: ${{ needs.docs_examples.result }}"
          echo "build: ${{ needs.build.result }}, test: ${{ needs.test.result }}"
          # the path filter must have run; a job it skipped is not a failure, but outside
          # pull requests (and whenever the filter wants them) every job must succeed
          [ "${{ needs.changes.result }}" = success ] || exit 1
          code="${{ needs.changes.outputs.code }}"
          docs="${{ needs.changes.outputs.docs }}"
          want_tests=$([ "${{ needs.changes.outputs.shards }}" != "[]" ] && echo true || echo false)
          # a docs-only change has no build job, so `docs_examples` builds wiz and checks
          # the snippets; a code change runs the same check in `build`
          want_docs_examples=$([ "$code" = false ] && [ "$docs" = true ] && echo true || echo false)
          check() { # NAME RESULT WANTED
            if [ "$3" = true ]; then [ "$2" = success ] || { echo "$1: $2 (needed)"; exit 1; }
            else [ "$2" = success ] || [ "$2" = skipped ] || { echo "$1: $2"; exit 1; }; fi
          }
          check "docs style" "${{ needs.docs_style.result }}" true
          check "docs examples" "${{ needs.docs_examples.result }}" "$want_docs_examples"
          check build "${{ needs.build.result }}" "$code"
          check test "${{ needs.test.result }}" "$want_tests"

  # The three-stage bootstrap fixpoint (scripts/fixpoint.sh): stage-1 C = stage-2 C =
  # stage-3 C. Scheduled runs use the default branch (master). This weekly job stays on
  # ubuntu-latest as the fallback; the nightly .github/workflows/fixpoint.yml is the
  # opt-in one on the self-hosted runner.
  fixpoint:
    name: bootstrap fixpoint
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.fixpoint)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup
        with:
          cachix-name: ${{ env.CACHIX_NAME }}
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # the fixpoint still builds with Lake (scripts/fixpoint.sh)
          lean: true
      - name: Cache the Lake build and the elaboration cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .lake
            ~/.cache/wiz
          key: fixpoint-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('lakefile.lean', '**/*.lean', 'selfhost/*.wiz', 'lib/*.wiz') }}
          restore-keys: fixpoint-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Fixpoint
        run: scripts/fixpoint.sh .lake/fixpoint 2>&1 | tee fixpoint.log
      - name: Summary
        if: always()
        shell: bash
        run: |
          { echo "### Bootstrap fixpoint"; echo; echo '```'; grep -E 'FIXPOINT|^==|^stage [0-9]|^   |^total|^timings|^FAILED' fixpoint.log || echo "(no result)"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
