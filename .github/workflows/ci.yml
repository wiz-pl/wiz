# Wiz CI. See "Continuous integration" in docs/building.md.
#
# Runs on `master` (the integration branch, with the solutions in it) and on pull
# requests into it: the full suite, split into shards (.github/test-shards.json). The
# toolchain is built once, with Nix, and a push to master publishes it to the trusted
# Cachix cache (a pull request publishes only to its own untrusted PR cache); the test
# shards substitute those store paths instead of rebuilding (no Lake build and no
# `.lake` Actions cache on the critical path).
#
# Lake seeds have a direction: a push to master's `lake_seed` job builds
# `withLakeCache empty-lake` — a cold compile *inside* the derivation, whose `.lake`
# output is the seed — and publishes that store path (`.#lake-seed`) to the trusted
# Cachix; a pull request restores its own untrusted seed first and otherwise names its
# base commit's `.#lake-seed` and substitutes it from Cachix, then builds
# `withLakeCache <seed>` (flake.nix), recompiling only the modules the branch changed.
# Nothing a pull request writes is read by a trusted job: the producer only ever passes
# `empty-lake` (it has no restore step), a pull request never writes this namespace, and
# its only write is the PR-scoped `lean` subset cache (`.subset-cache/lean`, keyed by
# the `lean` subset's sha). Pushes, the merge queue and the release path keep the pure
# `nix build`. The exercise tree
# (scripts/mkexercises.py) is checked only when a release is tagged: release.yml's
# `exercise tree` job, which must pass before anything is published (it still builds
# with Lake, as does the weekly fixpoint).
name: CI

on:
  push:
    branches: [master]  # agent branches are tested through their PRs
  pull_request:
    branches: [master]
  # the merge queue (docs/building.md, "Merging"): each queued PR is tested merged onto
  # master and the PRs ahead of it, and lands only if this run's `CI result` passes
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "23 2 * * 1" # Mondays: the bootstrap fixpoint check
  workflow_dispatch:
    inputs:
      fixpoint:
        description: Also run the bootstrap fixpoint check (slow)
        type: boolean
        default: false

# Concurrency: one group per ref, except that a pull request carries its RUN id, a push to
# master its commit sha (and a manual run its id), so no run ever cancels or replaces
# another:
#   * pull_request: the run id, not the ref. A PR run has 43 jobs and takes over an hour;
#     a newer head used to cancel it, and a cancelled shard's verdict is a wasted hour of
#     runner time (three runs tonight ended that way, one of them mid-`web`). The old head
#     can no longer merge, so nothing is lost by letting it finish: the `changes` job and
#     `CI result` still report per-run, and `gh pr checks` shows the newest run.
#   * push to master: NOT cancelled. Every master commit needs its own complete run:
#     nightly.yml moves `nightly` only to a commit whose CI passed, and release.yml
#     publishes a snapshot for every commit (review ci-04/ci-06). The sha in the group
#     also stops GitHub from replacing a *pending* run with a newer push.
#   * merge_queue: its own ref (gh-readonly-queue/master/pr-N-SHA); the queue cancels the
#     entry when it leaves the queue, never this rule.
#   * schedule: the weekly fixpoint has its own group (`-fixpoint`) and is never cancelled
#     by a merge.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && format('run-{0}', github.run_id) || github.sha }}-${{ github.event_name == 'schedule' && 'fixpoint' || 'checks' }}${{ github.event_name == 'workflow_dispatch' && format('-dispatch-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/integration/') }}

# Least privilege: this workflow only reads the repository. The Cachix push uses the
# CACHIX_AUTH_TOKEN secret (not a token permission); `deploy-docs` asks for its own
# pages/id-token below, the only job that needs either.
permissions:
  contents: read

env:
  # The trusted Cachix binary cache (empty: none, everything comes from
  # cache.nixos.org). Only a push to master publishes to it; the jobs that pass a token
  # to the setup action use it for substitution only (`skipPush: true`). A pull request
  # publishes only to its own untrusted cache, named by the repository variable
  # CACHIX_PR_NAME and authenticated by the secret CACHIX_PR_AUTH_TOKEN; without that
  # token it publishes nothing, and its shards build the paths themselves. See
  # docs/ci-runner.md, "Which cache is trusted".
  CACHIX_NAME: badlydrawnwizards
  # The PR cache's name comes from repository settings (CACHIX_PR_NAME), never a literal
  # here: it is untrusted and must never be added to trusted-public-keys.
  CACHIX_PR_NAME: ${{ vars.CACHIX_PR_NAME }}
  # Lake's artifact cache (enableArtifactCache in lakefile.lean) inside .lake rather than
  # under the elan toolchain. Only the jobs that still run Lake use it: the weekly
  # fixpoint (and release.yml, which has its own workflow).
  LAKE_CACHE_DIR: ${{ github.workspace }}/.lake/cache

defaults:
  run:
    shell: nix develop --command bash -eo pipefail {0}

# The job graph, keyed by the repository subsets (`.github/repo-subsets.json`,
# `scripts/repo-subsets.py`). The `changes` job publishes one `subset_<name>` boolean
# per subset; a job's `if:` and the `CI result` verdict below use the same condition,
# so a job is required exactly when it runs. `subset_packages`/`subset_runtime` gate
# the jobs new to this split; `lean` cannot gate on its subset alone because it builds
# the test driver and emits the shard matrix every code change needs.
#
#   job                     | subset                         | gating output
#   ------------------------+--------------------------------+------------------------
#   changes                 | all (path filters)             | every run but schedule
#   docs_style              | docs (static checks)           | always
#   name collisions (reachable) | docs/lean (static)         | always
#   prelude drift           | docs/wizlib (static)           | always
#   docs_examples           | docs                           | code == false && docs
#   source tarball          | release artifacts              | code
#   attestation verifier    | scripts/attest                 | always
#   lean                    | lean (wiz/tests build)         | code
#   lake seed               | lean (the cold seed)           | push to master && code
#   trust ledger            | wizlib (walks lib/)            | code
#   STC metatheory          | STC.lean, STC/                 | stc || code
#   tests                   | tests (the shard matrix)       | shards != []
#   wasm modules            | web (Wasm page modules)        | web
#   web                     | web (browser-free tests)       | web
#   docs, docs check        | docs (the published site)      | code && web, not schedule
#   deploy docs to Pages    | docs                           | a push to master
#   packages (x4)           | packages (scry/, hdl/, tower/) | subset_packages
#   runtime                 | runtime (runtime/, c/)         | subset_runtime
#   CI result               | all                            | every run but schedule
#   bootstrap fixpoint      | (none: schedule/dispatch)      | schedule or fixpoint input
#
# A changed file that matches several subsets sets all of them; a file no subset
# claims (`scripts/`, `flake.*`, `selfhost/`, ...) or any `.github/` edit sets every
# subset, so an input the table does not classify still runs every job (as
# `changes --all` does for a push). The `lean` job also reads `tests/` and `runtime/`
# through flake.nix's build fileset, and it emits the shard matrix, so it runs for any
# `code` change; on a `wizlib`/`packages` change the sources and seed are unchanged and
# the build is warm (Cachix substitutes the store paths or Lake recompiles nothing).
#
# Subset caches (the untrusted/PR reuse rule). `scripts/ci.py subset-key NAME
# [--with NAME] [--scope S] [--suffix S]` prints one `key=` and one `prefix=`:
#
#   key    subset-v1-<name>[-<name>…]-<os>-<arch>-<toolchain12>[-<scope>]-<sha12>[-<sha12>…][-<suffix>]
#   prefix subset-v1-<name>[-<name>…]-<os>-<arch>-<toolchain12>[-<scope>]-
#
#   <sha12>        first 12 hex of the subset's `sha256` in .github/repo-subsets.json
#   <toolchain12>  first 12 hex of sha256(flake.lock + lean-toolchain)
#   <os>/<arch>    runner.os/runner.arch, lowercased
#
#   job            path(s) cached                  exact key (os/arch/toolchain elided)
#   -------------- ------------------------------- -----------------------------------
#   lean           .subset-cache/lean             subset-v1-lean-…-<lean12>
#   lean           .lake/docs-examples            subset-v1-lean-…-docs-examples-<lean12>
#   docs_examples  .lake/docs-examples            subset-v1-docs-…-examples-<docs12>
#   packages       scry/.grail                    subset-v1-packages-…-<compiler-key>-<packages12>
#   tests          ~/.cache/wiz, .grail,          subset-v1-tests-wizlib-…-<shard>-
#                  /tmp/wiz-selfhost-*            <compiler-key>-<selfhost/lib>-<tests12>-
#                                                 <wizlib12>-<wiz tree>
#   trust_ledger   .lake/trust-cache              subset-v1-wizlib-…-<driver sha>-<wizlib12>
#   web, wasm, runtime  (no Actions cache)        their products are Nix store paths in the
#                                                 PR Cachix cache (content-addressed) or the
#                                                 runtime script is a temporary build
#
#   * restore: `actions/cache/restore` with `key: steps.<subset-key>.outputs.key` and
#     `restore-keys: steps.<subset-key>.outputs.prefix`, in the job that owns the subset;
#   * save: `actions/cache/save` with the same key, guarded only by the restore's
#     `cache-hit != 'true'`. There is no `always()`. A failed build (or a failed
#     docs/package/test step for that cache) reaches no save step, so it cannot write a
#     cache for the next run to trust. The lean seed is saved right after the Nix build,
#     so a later docs/web failure does not discard it.
#   * the trusted Lake seed is not an Actions entry: `lake_seed` publishes the
#     `.#lake-seed` store path to Cachix, and a PR substitutes its base commit's output
#     (`scripts/lake-cache.sh trusted`). A PR writes only the subset keys above, and a
#     PR's Actions entries are PR-scoped and untrusted.
#
# On this tree (linux/x64, toolchain d6162537714e) the exact keys are:
#   subset-v1-lean-linux-x64-d6162537714e-f5590ef639de
#   subset-v1-lean-linux-x64-d6162537714e-docs-examples-f5590ef639de
#   subset-v1-docs-linux-x64-d6162537714e-examples-<docs12>
#   subset-v1-packages-linux-x64-d6162537714e-<compiler-key>-c9d78b065f35
#   subset-v1-tests-wizlib-linux-x64-d6162537714e-<shard>-<compiler-key>-<selfhost/lib>-03517ef46948-8ed9ac2c4f10-<wiz tree>
#   subset-v1-wizlib-linux-x64-d6162537714e-<driver sha>-8ed9ac2c4f10
# `<docs12>` is read from .github/repo-subsets.json; it is not written out here because
# this file (`.github/**`) is part of the `docs` subset, so any edit to it moves that
# sha. The other subset shas are stable across CI edits. The toolchain part moves with
# flake.lock/lean-toolchain.

jobs:
  # Path filters: which jobs a pull request needs (scripts/ci.py changes; the shards'
  # "inputs" in .github/test-shards.json, and `web/*` for the web job). A docs-only PR
  # builds no shard and runs no test, but it does check the documentation's Wiz examples
  # (docs_examples); a PR touching only lib/ files no core test reads skips the core
  # shard; the selfhost shards run for selfhost/ and the lib/ files it imports. An
  # STC-only PR (`STC.lean`, `STC/`) builds no shard either: it runs the `stc` job, which
  # is the only thing that typechecks the metatheory.
  # Everything but a pull_request (pushes, the merge queue, manual runs) runs every job.
  changes:
    name: changes
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # 5 min: a checkout and one `git diff`; no build
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
      web: ${{ steps.filter.outputs.web }}
      # `STC.lean` or `STC/`: the `stc` job (the metatheory library nothing else imports)
      stc: ${{ steps.filter.outputs.stc }}
      # One per subset of `.github/repo-subsets.json` (`scripts/repo-subsets.py`); the
      # job graph comment above names which job each one gates.
      subset_lean: ${{ steps.filter.outputs.subset_lean }}
      subset_runtime: ${{ steps.filter.outputs.subset_runtime }}
      subset_wizlib: ${{ steps.filter.outputs.subset_wizlib }}
      subset_packages: ${{ steps.filter.outputs.subset_packages }}
      subset_tests: ${{ steps.filter.outputs.subset_tests }}
      subset_docs: ${{ steps.filter.outputs.subset_docs }}
      shards: ${{ steps.filter.outputs.shards }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 2 # a pull request's merge commit and its first parent (the base)
      - name: What changed
        id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD | sed 's/^/  /'
            python3 scripts/ci.py changes HEAD^1 HEAD >> "$GITHUB_OUTPUT"
          else
            python3 scripts/ci.py changes --all >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  # (seconds, no build) Documentation style: no authoring-environment paths, no
  # agent roles and no status checkmarks (scripts/check-docs-style.py), and every
  # relative link and anchor in the docs resolves (scripts/check-doc-links.py;
  # external links are reported but not fetched). The same job runs the quadratic-shape
  # lint on the pull request's changed `.lean`/`.wiz` lines only
  # (scripts/check-complexity --diff HEAD^1), so a new append-in-loop or eraseDups fails
  # a PR before the build starts. A bounded site is excused inline, on the line or the
  # line above it (`-- complexity: ok (why it is bounded)`); there is no allowlist file.
  # Early in the job, scripts/check-companion-lists.py checks the lists a commit must
  # move with its source (libdiff corpus, legacy names + digest, collision baseline),
  # and scripts/check-release-consistency.py checks the release packet and that the
  # docs still name the versions, channels, commands and artifacts the tree produces.
  # Runs on every pull request too, including docs-only ones, which build and test skip.
  docs_style:
    name: docs style
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # `check-release-consistency` resolves the release packet's candidate and its PR
    # counts through `gh`; without a token it cannot, and an *unverifiable* count is a
    # failure (exit 2), not a pass. Read-only on both.
    permissions:
      contents: read
      pull-requests: read
    # 5 min: six Python checks and the libdiff corpus check on the checkout; no build
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # 0: check-release-consistency resolves the packet's candidate (an older
          # commit) and its counts; check-complexity uses HEAD^1.
          fetch-depth: 0
      - name: Check the generated companion lists
        shell: bash
        run: |
          python3 scripts/check-companion-lists.py --self-test
          python3 scripts/check-companion-lists.py
      - name: Check the docs, and the checker's fixtures
        shell: bash
        run: |
          python3 scripts/check-docs-style.py --self-test
          python3 scripts/check-docs-style.py
          python3 scripts/check-doc-links.py --self-test
          python3 scripts/check-doc-links.py --quiet
          python3 scripts/check-complexity --self-test
          python3 scripts/check-complexity --diff HEAD^1
          python3 scripts/check-name-collisions.py --self-test
          python3 scripts/check-name-collisions.py --quiet
          python3 scripts/check-names.py --self-test
          python3 scripts/check-names.py --quiet
          python3 scripts/check-boundaries.py --self-test && python3 scripts/check-boundaries.py --quiet
          scripts/check-libdiff-corpus.sh --self-test && scripts/check-libdiff-corpus.sh --quiet
      - name: Check the release packet and the machinery it describes
        shell: bash
        env:
          # `gh pr view`/`gh api` for the packet's candidate counts. Unset, the check is
          # UNVERIFIABLE and exits 2.
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/check-release-consistency.py --self-test
          python3 scripts/check-release-consistency.py --quiet

  # (seconds, no build) The self-hosted frontend's prelude (`preludeText`,
  # selfhost/Frontend.wiz) is a hand-written subset of lib/Prelude.wiz. The playground
  # compiles that frontend, so a name added to lib/Prelude.wiz but not to the embedded
  # copy is invisible on the page and a new `selfhost-libdiff` gap. This ratchets the
  # surface (coverage, no invented names, reviewed exceptions); the script's docstring
  # says what is and is not compared.
  prelude_drift:
    name: prelude drift
    needs: changes
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # 5 min: two Python checks on the checkout; no build
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Check the embedded prelude's surface
        shell: bash
        run: |
          python3 scripts/check-prelude-drift.py --self-test
          python3 scripts/check-prelude-drift.py

  # (seconds, no build) The strict half of the name-collision check: a global group is
  # reported only when two of its declarations can share a transitive importer, i.e.
  # can be loaded in one program. The broad project-wide run lives in docs_style; its
  # baseline records the groups that are independent programs today
  # (scripts/check-name-collisions.py, .github/name-collisions-baseline.json).
  # One extra first-wave job: the check is <1 s, so it holds a concurrency slot for
  # roughly a checkout's minute and delays a queued job by that, not by a shard's build.
  name_collisions_reachable:
    name: name collisions (reachable)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # 5 min: one Python check on the checkout; no build (the check takes <1 s)
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Reachable global name collisions
        shell: bash
        run: python3 scripts/check-name-collisions.py --reachable --quiet

  # The Wiz snippets in docs/**/*.md (scripts/check-docs-examples.py). A docs-only
  # pull request has no `lean` job, so this one substitutes `wiz` from Cachix (the
  # same store path `lean` publishes) and checks the snippets. A pull request reads
  # the trusted cache anonymously; it never gets its auth token.
  docs_examples:
    name: docs examples
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.code == 'false' && needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    # 30 min: substitute wiz from Cachix, then the snippet check (a cache miss rebuilds)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
        with:
          cachix-name: ${{ env.CACHIX_NAME }}
          cachix-token: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && secrets.CACHIX_AUTH_TOKEN || '' }}
          lean: false
      - name: Subset cache key (the docs subset)
        # The docs examples cache is the `docs` subset's cache, not a hash of the Lean
        # tree: `subset-v1-docs-<os>-<arch>-<toolchain sha12>-examples-<docs sha12>`.
        # The checker keys its own entries by the compiler and lib/ sources, but the
        # outer `cache-hit` decides whether the refreshed entries are saved at all: a
        # lib/ change must make this a miss (and the save run), so pin the lib tree.
        id: subset-key
        shell: bash
        run: python3 scripts/ci.py subset-key docs --scope examples --suffix "$(git rev-parse HEAD:lib)" >> "$GITHUB_OUTPUT"
      - name: nix build wiz (substituted from Cachix)
        id: nix
        shell: bash
        run: |
          nix build .#wiz --no-link -L
          wiz=$(nix path-info .#wiz)
          echo "wiz=$wiz" >> "$GITHUB_OUTPUT"
          "$wiz/bin/wiz" --version
      - name: Restore the docs examples cache
        id: docs-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/docs-examples
          key: ${{ steps.subset-key.outputs.key }}
          restore-keys: ${{ steps.subset-key.outputs.prefix }}
      - name: Check the docs examples
        # the default shell is the dev shell: `wiz run` blocks need `cc` and GMP
        run: |
          python3 scripts/check-docs-examples.py --self-test
          python3 scripts/check-docs-examples.py --wiz "${{ steps.nix.outputs.wiz }}/bin/wiz"
      - name: Save the docs examples cache
        # A successful docs check writes its own subset key; a failed one stops before
        # this step, so it cannot poison the next run's docs cache. A PR's entry is
        # PR-scoped (untrusted), and the same key is reusable by that PR's later runs.
        if: steps.docs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/docs-examples
          key: ${{ steps.subset-key.outputs.key }}

  # (seconds, no build) The source tarball and the release supply-chain artifacts
  # (scripts/source-tarball.py, scripts/release-sbom.py, docs/building.md): two builds
  # in different directories and environments are byte-identical, the manifest matches
  # the archive, SOURCE_DATE_EPOCH changes only the metadata, and the SBOM/provenance
  # parse, match every digest and are byte-identical on a second run. The Nix target
  # (.#release-tarball) is checked with `nix build --rebuild` in the `lean` job.
  source-tarball:
    name: source tarball
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Two builds are identical, and the manifest matches
        shell: bash
        run: scripts/test-source-tarball.sh
      - name: SBOMs and provenance parse, match every digest, and are deterministic
        shell: bash
        run: python3 scripts/test_release_sbom.py -v

  # (seconds, no build) Manifest canonicalization, DSSE/Ed25519 signing and
  # quote verification (scripts/attest).  The unit tests generate a throwaway
  # ssh-keygen key, use a stub tpm2_checkquote, and need no TPM, no Wiz build,
  # no committed private key and no network.
  attest:
    name: attestation verifier
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Test the statement signing, manifest format and verifier
        shell: bash
        run: python3 -m unittest discover -s scripts/attest/tests -v

  # The Lean subset's job: one Nix build of `wiz` and the test driver, which is the one
  # build every other job substitutes (a push to master publishes it; a pull request
  # publishes only to its own untrusted cache). It also carries the checks that need the
  # built compiler or test driver: `check-shards`, the shard matrix the `tests` job
  # expands, the reproducibility corpus, and the docs examples (which run against the
  # `wiz` this job just built, so a fork PR needs no second build). The package checks
  # live in `packages`, the runtime's own compile in `runtime`; both run beside this
  # job instead of serialising after the build.
  #
  # Gating: `code` (not `subset_lean` alone). The matrix is a job output, and every
  # shard that runs needs it plus the `tests`/`wiz` store paths, so skipping this job
  # on a `wizlib` or `packages` change would leave `fromJSON('')` for a non-empty
  # `shards` list. The build itself is warm on those changes: the sources and seed are
  # unchanged, so Cachix substitutes or Lake recompiles nothing.
  lean:
    name: lean
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # one cold Nix build (unwrapped + prewarm), then the Cachix push of ~1.8 GB. A pull
    # request's seeded build is the incremental one only after its first run (a miss is
    # the same cold build); the timeout covers the cold case.
    timeout-minutes: 90
    outputs:
      tree: solution # only the summary's title reads it (there is one tree now)
      matrix: ${{ steps.shards.outputs.matrix }}
      # what identifies the compiler and test driver (and the C toolchain they use); the
      # test shards key their Wiz build caches on it
      compiler-key: ${{ steps.key.outputs.compiler }}
      # the store paths of this commit's build (the shards substitute them from Cachix)
      wiz: ${{ steps.nix.outputs.wiz }}
      tests: ${{ steps.nix.outputs.tests }}
      # the two self-hosted programs (perf H2): built once here and passed to the shards
      # as `--selfhost-compiler/--selfhost-checker`, instead of every case's `/tmp` cache
      # rebuilding them from source on a fresh runner
      selfhost-compiler: ${{ steps.selfhost.outputs.compiler }}
      selfhost-checker: ${{ steps.selfhost.outputs.checker }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
        with:
          cachix-name: ${{ env.CACHIX_NAME }}
          # Only a push to master gets the trusted token: pulls, merge-queue runs and
          # dispatch read the public cache anonymously.
          cachix-token: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && secrets.CACHIX_AUTH_TOKEN || '' }}
          # A pull request adds its own untrusted cache, so a store path a previous run
          # of this PR published substitutes even when the subset cache key changed.
          cachix-pr-name: ${{ github.event_name == 'pull_request' && env.CACHIX_PR_NAME || '' }}
          cachix-pr-token: ${{ github.event_name == 'pull_request' && secrets.CACHIX_PR_AUTH_TOKEN || '' }}
          # no Lake here: nixpkgs' Lean builds the packages (elan is only for the
          # fixpoint)
          lean: false
      - name: Cache key
        id: key
        shell: bash
        run: |
          # what identifies the compiler and test driver (and the C toolchain they use)
          echo "compiler=${{ hashFiles('flake.lock', 'flake.nix', 'lean-toolchain', 'lake-manifest.json', 'lakefile.lean', '**/*.lean', 'runtime/**', 'c/**') }}" >> "$GITHUB_OUTPUT"
      - name: Subset cache key (the lean subset)
        # The untrusted, subset-keyed cache: `subset-v1-lean-<os>-<arch>-<toolchain
        # sha12>-<lean sha12>` (see scripts/ci.py subset-key and the "Subset caches"
        # block at the top of the workflow). It names only the `lean` subset, so a
        # `runtime` or `tests` change still offers the previous lean entry; Lake
        # recompiles the modules whose inputs changed.
        id: subset-key
        shell: bash
        run: python3 scripts/ci.py subset-key lean >> "$GITHUB_OUTPUT"
      - name: Restore the lean subset cache (a pull request, or an integration push)
        # First choice of seed: this branch's previous successful `lean` build. It is
        # untrusted (a branch writes it, a branch reads it), and independent of the
        # trusted namespace below and of any other subset's key. A push to an
        # `integration/*` branch is treated like a pull request here: the previous run of
        # the same branch is a legitimate seed, and without this every integration push
        # paid a cold Lean build (the `lake-trusted` step below was PR-only too).
        id: subset-cache
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/integration/'))
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .subset-cache/lean
          key: ${{ steps.subset-key.outputs.key }}
          restore-keys: ${{ steps.subset-key.outputs.prefix }}
      - name: Trusted Lake seed (the base commit's flake output, from Cachix)
        # The second choice (the PR's own lean subset cache is the first): the base
        # commit's `.#lake-seed` derivation (flake.nix). It is the same output master's
        # `lake_seed` job builds and publishes to the trusted Cachix, so Nix names the
        # store path and substitutes it; there is no tarball in an Actions cache, and
        # nothing a pull request writes can enter this cache. `trusted` prints `empty`
        # when the base predates the output or the cache does not hold it, and the build
        # falls back to `empty-lake` (never a failure).
        id: lake-trusted
        if: (github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/integration/'))) && steps.subset-cache.outputs.cache-hit != 'true'
        shell: bash
        # The base commit: on a pull request the merge target, on an integration push the
        # commit the branch was pushed from (`before`). An all-zero `before` (a new
        # branch) yields no seed, which is the same "empty" the script already handles.
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE"
          case "$base" in ''|*[!0]*) ;; *) echo "seed=empty" >> "$GITHUB_OUTPUT"; echo "trusted seed: empty (no base commit)"; exit 0 ;; esac
          dir="$RUNNER_TEMP/lake-base"
          rm -rf "$dir"; mkdir -p "$dir"
          git fetch --no-tags --depth=1 origin "$base"
          git archive "$base" | tar -x -C "$dir"
          seed=$(scripts/lake-cache.sh trusted "$dir")
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "trusted seed: $seed"
      - name: nix build (wiz, grail and the test driver; seeded on a PR or an integration push)
        id: nix
        # A seeded build for a pull request *and* for a push to an integration branch:
        # both have a legitimate base to seed from (the merge target, the pushed-from
        # commit). Before this, an integration push took the pure build and was cold every
        # time. A master push keeps the pure build: its output is what the trusted cache
        # publishes.
        env:
          USE_SEED: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/integration/')) }}
        run: |
          # One build for every job: the shards substitute these store paths (master's
          # from the trusted cache; a pull request's from its PR cache when published).
          # `packages.wiz` is the default package; `packages.tests` is the test driver,
          # from the same build.
          # No .#reference here: only `.#docs-lib` (inside the docs job's `.#pages`)
          # reads it, and no shard waits on it. The docs job builds it inside `.#pages`
          # from the **pure** `wiz`: the same store path as this one on a master push,
          # and a different one when this job takes the seeded path (`USE_SEED`), where
          # the docs job builds or substitutes the pure toolchain itself.
          if [ "$USE_SEED" = "true" ]; then
            # The seeded fast path (a pull request, or an integration push): the same
            # packages from a seeded `.lake`
            # (flake.nix's withLakeCache, a different derivation), so Lake recompiles
            # only the modules the branch changed. The seed is this branch's own
            # previous lean cache, else the base commit's `.#lake-seed` substituted from
            # the trusted Cachix, else `empty-lake` (the cold build — a miss is never a
            # failure). This build's `.lake` is saved below under the untrusted,
            # lean-keyed subset cache; only `lake_seed` on master publishes the trusted
            # store path.
            seed=$(scripts/lake-cache.sh choose .subset-cache/lean \
              "${{ steps.lake-trusted.outputs.seed }}")
            echo "seed: $seed"
            scripts/lake-cache.sh build "$seed" wiz tests unwrapped.lake | tee lake-paths
            wiz=$(sed -n 's/^wiz=//p' lake-paths)
            tests=$(sed -n 's/^tests=//p' lake-paths)
            lake=$(sed -n 's/^unwrapped\.lake=//p' lake-paths)
            scripts/lake-cache.sh save "$lake" .subset-cache/lean
          else
            # Not a pull request (a push, the merge queue, a manual run): the pure
            # build, which is what the trusted cache and the release path use.
            nix build .#wiz .#tests --no-link -L
            wiz=$(nix path-info .#wiz)
            tests=$(nix path-info .#tests)
          fi
          echo "wiz=$wiz" >> "$GITHUB_OUTPUT"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          # The one statement of "this run built the seeded variants": the self-hosted
          # programs below take the same branch, so an integration push (seeded) and a
          # merge_group run (not seeded) cannot disagree with it.
          echo "seeded=$USE_SEED" >> "$GITHUB_OUTPUT"
          echo "wiz: $wiz"; echo "tests: $tests"
          du -sh "$wiz" "$tests"
          nix path-info -S "$wiz" "$tests" | sed 's/^/closure: /'
      - name: The self-hosted programs (nix build .#selfhost-compiler .#selfhost-checker)
        # Perf H2: the suite used to build these in a `/tmp` cache keyed on the test
        # binary's mtime, ~20 times per run (9,257 s, 9.8%). They are derivations now, so
        # this job builds each once and the shards take the store paths through
        # `--selfhost-compiler/--selfhost-checker`.
        #
        # A pull request takes `lib.selfhostWith` with this job's *seeded* `wiz`/`tests`
        # store paths (the pure packages do not exist there, so `.#selfhost-compiler`
        # would cold-build the pure compiler); a master push takes the pure attributes,
        # whose outputs the trusted cache then serves to everyone.
        id: selfhost
        env:
          WIZ: ${{ steps.nix.outputs.wiz }}
          TESTS: ${{ steps.nix.outputs.tests }}
          # the same statement the nix step took (PR *or* integration push), not a second
          # guess at it: `event != 'push'` was wrong for merge_group (pure attributes on
          # a run whose wiz/tests are seeded) and for an integration push (the reverse)
          SEEDED: ${{ steps.nix.outputs.seeded }}
        run: |
          if [ "$SEEDED" = true ]; then
            sys=$(nix eval --impure --raw --expr builtins.currentSystem)
            expr="let f = builtins.getFlake \"$PWD\"; in f.lib.\"$sys\".selfhostWith { wiz = builtins.storePath \"$WIZ\"; tests = builtins.storePath \"$TESTS\"; }"
            comp=$(nix build --impure --no-link --print-out-paths --expr "($expr).compiler")
            check=$(nix build --impure --no-link --print-out-paths --expr "($expr).checker")
          else
            comp=$(nix build .#selfhost-compiler --no-link --print-out-paths)
            check=$(nix build .#selfhost-checker --no-link --print-out-paths)
          fi
          echo "compiler=$comp" >> "$GITHUB_OUTPUT"
          echo "checker=$check" >> "$GITHUB_OUTPUT"
          du -sh "$comp" "$check"
      - name: Save the lean subset cache (a pull request, or an integration push)
        # Untrusted and subset-keyed: this is the only writer of this key, and only a
        # successful build reaches it (a failed lean build stops the job before this
        # step). A later `lean` job restores it even if `docs`, `web` or a shard failed
        # in between; a failed run never writes or poisons another subset's key. An
        # integration push saves here too, so the next push to that branch is incremental
        # (it used to be cold every time, because both this and the restore were PR-only).
        if: (github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/integration/'))) && steps.subset-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .subset-cache/lean
          key: ${{ steps.subset-key.outputs.key }}
      - name: The source tarball is reproducible under Nix
        # a second build in a different build directory, compared byte for byte
        # (Nix 2.34 calls it --rebuild; older releases spell it --check)
        run: |
          nix build .#release-tarball -L --print-out-paths
          nix build .#release-tarball --rebuild -L
      - name: Publish the store paths to Cachix (master)
        # Only a push to master writes the trusted cache; a pull request writes its own
        # untrusted cache in the next step. Explicit (not the action's post-step) so that
        # exactly this commit's build is published, with the token only in this step's
        # environment; nothing on a pull request can reach the trusted token.
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -z "$CACHIX_AUTH_TOKEN" ]; then
            # A push to master is the only run that publishes the trusted cache, so a
            # missing secret means the cache stopped advancing (review ci-13): fail
            # loudly instead of leaving the run green.
            echo "::error title=Cachix::CACHIX_AUTH_TOKEN is empty on a run that must publish"
            exit 1
          fi
          # .#reference is an input of `.#docs-lib` (inside the docs job's `.#pages`),
          # not built here (#460), so it is not pushed.
          nix develop .#ci --command env CACHIX_AUTH_TOKEN="$CACHIX_AUTH_TOKEN" cachix push "$CACHIX_NAME" \
            ${{ steps.nix.outputs.wiz }} ${{ steps.nix.outputs.tests }} \
            ${{ steps.selfhost.outputs.compiler }} ${{ steps.selfhost.outputs.checker }}
      - name: Publish the store paths to the PR cache
        # A pull request writes only its own untrusted cache, with its own token. If the
        # repository variable or secret is absent (or this is a fork), nothing is
        # published: the shards build the paths, and nothing falls back to the trusted
        # cache or its token.
        if: github.event_name == 'pull_request'
        env:
          CACHIX_PR_AUTH_TOKEN: ${{ secrets.CACHIX_PR_AUTH_TOKEN }}
        run: |
          if [ -z "$CACHIX_PR_NAME" ] || [ -z "$CACHIX_PR_AUTH_TOKEN" ]; then
            echo "::warning title=Cachix::no CACHIX_PR_AUTH_TOKEN: the store paths are not published (set the CACHIX_PR_NAME variable and the CACHIX_PR_AUTH_TOKEN secret)"
            exit 0
          fi
          nix develop .#ci --command env CACHIX_AUTH_TOKEN="$CACHIX_PR_AUTH_TOKEN" cachix push "$CACHIX_PR_NAME" \
            ${{ steps.nix.outputs.wiz }} ${{ steps.nix.outputs.tests }} \
            ${{ steps.selfhost.outputs.compiler }} ${{ steps.selfhost.outputs.checker }}
      - name: Every test case is in exactly one shard
        run: |
          python3 scripts/ci.py check-shards --self-test
          python3 scripts/ci.py check-shards "${{ steps.nix.outputs.tests }}/bin/tests"
      - name: Every `lib.` call in ci.yml has a row in ci-shaped.nix
        # The touched-derivations selector (scripts/touched-derivations.sh) only sees
        # what .github/ci-shaped.nix names, so a new CI call site with no row would be
        # silently unselected. This is a text check: no nix, a few milliseconds.
        run: |
          python3 scripts/ci.py check-ci-shaped --self-test
          python3 scripts/ci.py check-ci-shaped
      - name: Shards
        id: shards
        run: |
          # a shard with "split" becomes several, balanced by .github/test-timings.json
          # only the shards this change needs (all of them outside pull requests)
          echo "matrix=$(python3 scripts/ci.py matrix --only '${{ needs.changes.outputs.shards }}' '${{ steps.nix.outputs.tests }}/bin/tests')" >> "$GITHUB_OUTPUT"
          python3 scripts/ci.py plan "${{ steps.nix.outputs.tests }}/bin/tests"
      - name: Reproducibility (two absolute paths)
        # generated C, binaries, .split/, -g debug info, LLVM output and the .grail tree
        # must be byte-identical under different PWD/HOME/TMPDIR/umask/locale/epoch/-j.
        # The JSON is asserted, not discarded: a run-level skip is exit 2, and a skipped
        # compiler comparison (this job does not pass --compiler) is a notice. The
        # nightly repro workflow runs --compiler and requires it.
        env:
          WIZ: ${{ steps.nix.outputs.wiz }}/bin/wiz
          GRAIL: ${{ steps.nix.outputs.wiz }}/bin/grail
        run: |
          # `nix develop --command` does not export the shellHook's WIZ_LLC here, and a
          # skipped LLVM comparison is now a failure (check-repro-report). Take it from
          # the dev shell's PATH, which includes pkgs.llvm.
          export WIZ_LLC="$(command -v llc)"
          scripts/check-repro.sh --self-test
          python3 scripts/check-repro-report.py --self-test
          status=0
          out="${RUNNER_TEMP:-/tmp}/repro.json"
          scripts/check-repro.sh --json > "$out" || status=$?
          cat "$out"
          python3 scripts/check-repro-report.py "$out" || status=$?
          exit $status
      - name: Subset cache key (the docs examples, in the lean job)
        # The lean job's own cache entry: `subset-v1-lean-<os>-<arch>-<toolchain12>-
        # docs-examples-<lean12>`. A code change checks the docs examples here,
        # inside the lean job, so the entry is keyed on the job's subset, not on `docs`;
        # the checker keys its individual results by the compiler and the snippet text,
        # so a docs edit still rechecks the changed blocks. A docs-only change runs the
        # `docs_examples` job instead, with the docs-keyed entry.
        id: docs-subset-key
        shell: bash
        run: python3 scripts/ci.py subset-key lean --scope docs-examples >> "$GITHUB_OUTPUT"
      - name: Restore the docs examples cache
        id: docs-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/docs-examples
          key: ${{ steps.docs-subset-key.outputs.key }}
          restore-keys: ${{ steps.docs-subset-key.outputs.prefix }}
      - name: Check the docs examples
        # the Wiz blocks in docs/**/*.md; a code change can stale one even without a
        # docs change, so every build checks them (seconds on a warm cache).  The
        # default shell is the dev shell, which `wiz run` blocks need for `cc` and GMP.
        run: |
          python3 scripts/check-docs-examples.py --self-test
          python3 scripts/check-docs-examples.py --wiz "${{ steps.nix.outputs.wiz }}/bin/wiz"
      - name: Save the docs examples cache
        # Only a successful check reaches this step, so a failed docs check cannot write
        # its key. The entry is a read-only check result; the lean build's own cache was
        # already saved above, independently.
        if: steps.docs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/docs-examples
          key: ${{ steps.docs-subset-key.outputs.key }}

  # The `packages` subset's job: the package outputs that live beside the compiler, not
  # in the test matrix's critical path — the Hdl package (`hdl/`, built and tested from
  # a copy of itself), the scry package (`scry/`, its CLI plus the native tree-sitter
  # library) and tower (`nix build .#tower`). What the old `build` job checked in its
  # "package" steps (the example index and a program built outside the checkout) is
  # here too. It runs only when `scry/`, `hdl/` or `tower/` changed.
  #
  # It substitutes the lean job's `wiz`/`grail` (a pull request's seeded path from the
  # PR cache; anything else from the trusted cache) with
  # `nix build --option max-jobs 0`, so the package builds use exactly the compiler this
  # commit publishes and the substitution never falls back to a cold `wiz-unwrapped`.
  # Tower is built with `lib.towerWith (builtins.storePath <seeded wiz>)` and guarded by
  # `scripts/check-seeded-wiz.py`; Hdl and Scry keep their in-job `$wiz`/`grail` path.
  packages:
    name: packages (${{ matrix.package }})
    # One job per package. They were one job that built hdl, scry and tower in
    # sequence: a failure in any of them cancelled nothing (fail-fast is off) but the
    # three waited for each other's setup, and the job's 60-minute timeout was sized for
    # the sum rather than for the slowest. A matrix keeps the same work with three
    # independent verdicts, three independent caches and parallel walls.
    needs: [changes, lean]
    if: >-
      !cancelled() && github.event_name != 'schedule' &&
      needs.changes.outputs.code == 'true' &&
      needs.changes.outputs.subset_packages == 'true' &&
      needs.lean.result == 'success'
    runs-on: ubuntu-latest
    # 60 min: scry's `grail build scry` is the longest single package (~12 min measured
    # in scry.yml); each matrix leg now waits only for its own work.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        package: [scry, hdl, tower, smoke]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
        with:
          cachix-name: ${{ env.CACHIX_NAME }}
          cachix-token: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && secrets.CACHIX_AUTH_TOKEN || '' }}
          # to substitute the lean job's seeded `wiz` on a pull request (its store path
          # is in the PR cache, or a miss falls back to the pure derivation below)
          cachix-pr-name: ${{ github.event_name == 'pull_request' && env.CACHIX_PR_NAME || '' }}
          cachix-pr-token: ${{ github.event_name == 'pull_request' && secrets.CACHIX_PR_AUTH_TOKEN || '' }}
          lean: false
      - name: Subset cache key (the packages subset)
        if: matrix.package == 'scry'
        # `subset-v1-packages-<os>-<arch>-<toolchain sha12>-<compiler-key>-<packages
        # sha12>`: the scry package's `.grail` tree is the only workspace cache this job
        # owns. The compiler key is the scope (a compiler change must not restore a tree
        # built by the old one); the packages subset's sha is the cache identity. The
        # tower and scry-native derivations are Nix store paths (the PR Cachix cache
        # serves them); the Hdl standalone build uses a temporary copy and writes
        # nothing back.
        id: subset-key
        shell: bash
        run: python3 scripts/ci.py subset-key packages --scope "${{ needs.lean.outputs.compiler-key }}" >> "$GITHUB_OUTPUT"
      - name: Restore the packages subset cache (a pull request)
        id: subset-cache
        if: matrix.package == 'scry' && github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: scry/.grail
          key: ${{ steps.subset-key.outputs.key }}
          restore-keys: ${{ steps.subset-key.outputs.prefix }}
      - name: wiz (the lean job's seeded compiler, substituted from Cachix)
        # The seeded compiler is a store path: `nix build --option max-jobs 0` is
        # substitution only (the configured trusted/PR caches; no local build jobs), so
        # a cache miss fails here instead of falling back to the pure `.#wiz` and
        # cold-building `wiz-unwrapped`.
        id: nix
        run: |
          wiz='${{ needs.lean.outputs.wiz }}'
          if [ -z "$wiz" ]; then
            echo "::error title=packages::the lean job produced no wiz store path"
            exit 1
          fi
          if ! nix build --no-link "$wiz" --option max-jobs 0; then
            echo "::error title=packages::the seeded wiz $wiz is not substitutable from the PR or trusted cache; refusing a cold wiz-unwrapped build"
            exit 1
          fi
          echo "wiz: substituted $wiz"
          echo "wiz=$wiz" >> "$GITHUB_OUTPUT"
          du -sh "$wiz"
          mkdir -p .lake/build/bin
          ln -sf "$wiz/bin/wiz" .lake/build/bin/wiz
          ln -sf "$wiz/bin/grail" .lake/build/bin/grail
          echo "$wiz/bin" >> "$GITHUB_PATH"
      - name: The Hdl package builds and tests standalone
        if: matrix.package == 'hdl'
        # `hdl/scripts/check-standalone.sh` copies only `hdl/`, then `grail build` and
        # `grail test` (the 32 golden examples and the two `-- test: run` outputs). The
        # yosys/Icarus/formal assertions stay in the `hdl` test shard.
        env:
          GRAIL: ${{ steps.nix.outputs.wiz }}/bin/grail
        run: hdl/scripts/check-standalone.sh
      - name: The scry package builds its CLI (and the native parser)
        if: matrix.package == 'scry'
        env:
          GRAIL: ${{ steps.nix.outputs.wiz }}/bin/grail
        run: |
          nix build .#scry-native --no-link -L
          # the C# native-link target reads this gitignored out-link (scry.yml does the
          # same); without it the build fails on a missing grammar
          nix build .#tree-sitter-c-sharp -o scry/native/tree-sitter-c-sharp
          cd scry
          cp ../grail.local.wiz .
          "$GRAIL" build scry
      - name: "tower is the third package build (seeded with the lean job's wiz)"
        if: matrix.package == 'tower'
        # `lib.towerWith (builtins.storePath <seeded wiz>)` makes the seeded compiler an
        # input source of tower-unwrapped, so Nix substitutes it and never starts
        # `wiz-unwrapped`. The guard asserts that on the derivation graph before the
        # build; it is what the old `nix build .#tower` lacked.
        id: tower
        env:
          WIZ: ${{ steps.nix.outputs.wiz }}
        run: |
          set -eu
          sys=$(nix eval --impure --raw --expr builtins.currentSystem)
          expr="let f = builtins.getFlake \"$PWD\"; in f.lib.\"$sys\".towerWith (builtins.storePath \"$WIZ\")"
          drv=$(nix eval --impure --raw --expr "($expr).drvPath")
          nix derivation show "$drv" > "$RUNNER_TEMP/tower.json"
          python3 scripts/check-seeded-wiz.py --self-test
          python3 scripts/check-seeded-wiz.py "$RUNNER_TEMP/tower.json" "$WIZ" --through tower-unwrapped
          out=$(nix build --impure --no-link --print-out-paths --expr "$expr")
          "$out/bin/tower" --help > /dev/null
          du -sh "$out"
      - name: The example index validates offline
        if: matrix.package == 'smoke'
        # stage 23m: entries, archive SHA-256s, semver ranges, module-prefix conflicts and
        # index.wiz; no network (the sources are relative paths).
        env:
          GRAIL: ${{ steps.nix.outputs.wiz }}/bin/grail
        run: scripts/grail-index-check.sh examples/fate-index
      - name: A package check, build and run outside the checkout
        if: matrix.package == 'smoke'
        # what the old `package` job tested: a program is checked and built from a
        # directory with no checkout, and grail starts. The store paths from the build
        # step (not `nix run …#wiz`, which would evaluate, and on a pull request rebuild,
        # the pure packages).
        env:
          WIZ: ${{ steps.nix.outputs.wiz }}
          GRAIL: ${{ steps.nix.outputs.wiz }}/bin/grail
        run: |
          dir=$(mktemp -d)
          cp examples/io.wiz "$dir/"
          cd "$dir"
          "$WIZ/bin/wiz" check io.wiz
          "$WIZ/bin/wiz" build io.wiz -o io
          ./io | head -3
          "$GRAIL" 2>&1 | head -2
      - name: Save the packages subset cache (a pull request)
        # The end of the leg: this leg's package build passed, so a partial run writes
        # nothing. The entry is PR-scoped and untrusted; a later run of this PR restores
        # `scry/.grail` when the `packages` subset's sha is unchanged.
        if: matrix.package == 'scry' && github.event_name == 'pull_request' && steps.subset-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: scry/.grail
          key: ${{ steps.subset-key.outputs.key }}

  # The `runtime` subset's job: the C runtime compiles on its own (`runtime/wiz_rt.h`,
  # `runtime/rt_*.inc`) in every ABI/threading configuration, and the one-thread build's
  # no-pthread claim is checked by linking against stubs. It needs no Wiz build, so it
  # runs immediately when `runtime/` or `c/` changed, beside `lean` instead of after it.
  #
  # It owns no Actions cache: scripts/test-runtime.sh builds into a temporary directory
  # and deletes it; the work is a few seconds of cc, and a cache entry would carry
  # nothing reusable.
  runtime:
    name: runtime
    needs: changes
    if: >-
      !cancelled() && github.event_name != 'schedule' &&
      needs.changes.outputs.code == 'true' &&
      needs.changes.outputs.subset_runtime == 'true'
    runs-on: ubuntu-latest
    # 15 min: cc -fsyntax-only in every configuration, then the stub-pthread binaries
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
        with:
          cachix-name: ${{ env.CACHIX_NAME }}
          lean: false
      - name: The runtime compiles on its own
        # cc -fsyntax-only -Wall -Wextra, with WIZ_API= (the object ABI) and WIZ_API=static
        # (a generated program); the header's prototypes are checked against the parts.
        # (`scripts/test-embed.sh`, which needs an incremental Lake build, is a local
        # dev-shell check now: `nix develop -c scripts/test-embed.sh`.)
        run: scripts/test-runtime.sh

  # The trusted Lake seed (a push to master). The trust direction is in
  # scripts/lake-cache.sh's header and in docs/building.md; it is structural here:
  #
  #   * the producer is `withLakeCache empty-lake`: the same function a pull request
  #     calls, applied to an empty seed, so the **sandbox** is the cold boundary —
  #     no cache is restored, no dev shell, no impure path. Its `bin` is **expected** to
  #     be byte-identical to the pure build's (the same compile); the seed measurement's
  #     `cmp` is the evidence and has not yet run, so this is a design expectation, not a
  #     measured fact, and it is what makes the producer a trustworthy substitute;
  #   * its `unwrapped.lake` output (`.lake/build/lib`, `.lake/build/ir`, `.lake/config`
  #     and the toolchain stamp; no `build/bin`, no `.lake/cache`) is the seed,
  #     `.#lake-seed`. The job publishes that store path to the trusted Cachix; this
  #     job is its only writer. A pull request names its base commit's same output and
  #     substitutes the path (`scripts/lake-cache.sh trusted`) — there is no trusted
  #     Actions-cache entry for `.lake`, and a pull request writes only its own
  #     PR-scoped subset cache;
  #   * nothing waits on it (it runs beside `lean`, off the shards' critical path). It
  #     needs no elan (`lean: false`): nixpkgs' Lean compiles it, exactly as the pure
  #     build does.
  lake_seed:
    name: lake seed
    needs: changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # the cold compile (no prewarm: this job builds only `unwrapped`), with slack
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
        with:
          cachix-name: ${{ env.CACHIX_NAME }}
          # substitution only here (cachix-action's skipPush); the explicit step below
          # publishes exactly this job's seed
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # nixpkgs' Lean, as the pure build uses: no elan and no dev-shell `lake build`
          lean: false
      - name: Build the cold seed (.#lake-seed)
        # There is no restore step anywhere in this job: the seed comes from this
        # derivation (`withLakeCache empty-lake`'s `lake` output), so a pull request's
        # `.lake` can never become the trusted one. The store path is pushed below; a
        # pull request names its base commit's same output and substitutes it.
        id: seed
        shell: bash
        run: |
          lake=$(nix build .#lake-seed --no-link --print-out-paths -L)
          echo "seed: $lake"
          echo "lake=$lake" >> "$GITHUB_OUTPUT"
      - name: Publish the trusted seed to Cachix
        # The trusted substituter is the only place a pull request can get this seed.
        # An empty token would silently stop the seed from advancing (review ci-13), so
        # fail loudly, as the `lean` job's publish step does.
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -z "$CACHIX_AUTH_TOKEN" ]; then
            echo "::error title=Cachix::CACHIX_AUTH_TOKEN is empty on a run that must publish"
            exit 1
          fi
          nix develop .#ci --command env CACHIX_AUTH_TOKEN="$CACHIX_AUTH_TOKEN" \
            cachix push "$CACHIX_NAME" "${{ steps.seed.outputs.lake }}"
          # A pull request's `trusted` check reads this cache; a push that did not make
          # the seed substitutable would silently send every PR back to a cold build.
          nix path-info --store "https://$CACHIX_NAME.cachix.org" \
            "${{ steps.seed.outputs.lake }}" >/dev/null
          echo "published and substitutable: ${{ steps.seed.outputs.lake }}"

  # The trust ledger (scripts/trust-ledger.sh, .github/trust-baseline.tsv): every
  # declaration of `lib/` (and the axiom-free example) goes through `#print axioms`, and a
  # source of trust the reviewed baseline does not list fails the run, as does an expired
  # row (`--strict-legacy` refuses the migration's sentinel reason/owner too).
  #
  # Its own job, not a step of `lean`: the walk takes ~8 min and nothing the shards need
  # waits on it, so `lean` publishes the store paths and the matrix, the shards start,
  # and this job runs beside them. It substitutes the test driver from Cachix (the store
  # path `lean` publishes) rather than rebuilding it; a fork pull request, whose `lean`
  # could not publish, builds it here (its shards build too). `result` requires the job
  # when code changed, so it is still a gate, just not one on the critical path. It does
  # not need `lean`'s store path to be substitutable: a fork (which could not publish)
  # builds the unchanged driver here with `nix build .#tests`.
  trust_ledger:
    name: trust ledger
    needs: [changes, lean]
    if: >-
      !cancelled() && github.event_name != 'schedule' &&
      needs.changes.outputs.code == 'true' &&
      (needs.lean.result == 'success' || needs.lean.result == 'skipped')
    runs-on: ubuntu-latest
    # 75 min: the whole-lib walk (cold, when the elaboration cache misses) plus the
    # fixture trees and the host-side ledger. A fork pull request has no Cachix token,
    # so it builds the test driver here (~the lean job's cold build) and then walks;
    # this repository's pull requests substitute it from the PR cache.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
        with:
          cachix-name: ${{ env.CACHIX_NAME }}
          # Only a push to master gets the trusted token: a pull request reads the
          # trusted cache anonymously and adds its own untrusted cache instead.
          cachix-token: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && secrets.CACHIX_AUTH_TOKEN || '' }}
          cachix-pr-name: ${{ github.event_name == 'pull_request' && env.CACHIX_PR_NAME || '' }}
          cachix-pr-token: ${{ github.event_name == 'pull_request' && secrets.CACHIX_PR_AUTH_TOKEN || '' }}
          lean: false
      - name: nix build (the test driver, from Cachix), and point .lake at it
        id: nix
        run: |
          # The lean job's driver (a PR's from the seeded build); a store path
          # substitutes directly, and a missing one (a fork, or a lean job whose paths
          # were not published) falls back to the derivation.
          tests='${{ needs.lean.outputs.tests }}'
          if [ -z "$tests" ] || ! nix build --no-link "$tests"; then
            tests=$(nix build .#tests --no-link --print-out-paths)
          fi
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          du -sh "$tests"
          # the ledger driver and the fixture scripts name `.lake/build/bin/tests`
          mkdir -p .lake/build/bin
          ln -sf "$tests/bin/tests" .lake/build/bin/tests
      - name: Subset cache key (the wizlib subset)
        # `subset-v1-wizlib-<os>-<arch>-<toolchain sha12>-<driver sha>-<wizlib sha12>`:
        # the walk reads lib/, so the lib subset's sha is the cache identity; the driver
        # bytes are the scope (every entry is mixed with `Cache.binaryId`, so another
        # driver's entries are never read). The prefix keeps the driver but not the lib
        # sha, so a library change restores the layers of unchanged modules.
        id: key
        shell: bash
        run: |
          bin=$(sha256sum "${{ steps.nix.outputs.tests }}/bin/tests" | cut -d' ' -f1)
          prefix=""
          if [ "${{ github.event_name }}" = pull_request ]; then
            prefix="pr-${{ github.event.pull_request.number }}-"
          fi
          python3 scripts/ci.py subset-key wizlib --scope "${prefix}${bin}" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
      - name: Restore the elaboration cache (PR-scoped on a pull request)
        id: trust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/trust-cache
          key: ${{ steps.key.outputs.key }}
          restore-keys: ${{ steps.key.outputs.prefix }}
      - name: The trusted base matches the baseline
        # The elaboration cache: master writes the restored layer (content-addressed
        # entries, from the same sources it checks; the save step publishes it). Every
        # other run passes `--cache-ro` and only reads it, so a pull request or a
        # merge-queue entry cannot change what the next run restores; a miss is then
        # elaborated as in a cold run, not an error.
        env:
          TRUST_CACHE_MODE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && '--cache' || '--cache-ro' }}
        run: |
          # This job builds only the driver (`tests`), not `wiz`, so it has no packaged
          # `share/wiz/cache` to add as a layer; its own `.lake/trust-cache` is the
          # driver's cache and is `--cache-ro` on every non-master run.
          scripts/trust-ledger.sh --check --strict-legacy "$TRUST_CACHE_MODE" .lake/trust-cache
          Tests/trust-ledger/run.sh
          scripts/trust-ledger-merge_test.sh
          python3 scripts/host-unsafe-ledger.py --check
          Tests/host-unsafe-ledger/run.sh
      - name: Save the elaboration cache (master)
        if: steps.trust-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/trust-cache
          key: ${{ steps.key.outputs.key }}

  # The STC metatheory (`STC.lean`, `STC/`: ~5k lines, 226 theorems) is a separate Lake
  # library, deliberately not a default target, and nothing else imports it. This is the
  # only place it is typechecked: `lean` is the Nix build of wiz/tests, and `STC/` is
  # not in flake.nix's `unwrapped` fileset on purpose (that would rebuild the compiler on
  # every STC edit). Its own job, off the critical path; `result` gates on it.
  #
  # It runs for an STC edit (the `stc` output of `scripts/ci.py changes`) and for any
  # `code` change: a `lean-toolchain` or `lakefile.lean` bump can break the target
  # without touching `STC/`. `scripts/check-stc.sh` builds `STC` and
  # `STC.Prototype.Totality` (which is outside `STC.lean`'s import closure), requires an
  # `.olean` for every `.lean` under `STC/` (so an unimported file cannot rot), and
  # rejects `sorry`/`admit`/`axiom`. That script also holds the two deliberate breaks
  # that prove this job can fail (`self-check`) and the job's cost.
  stc:
    name: STC metatheory
    needs: changes
    if: github.event_name != 'schedule' && (needs.changes.outputs.stc == 'true' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    # 15 min: restore the elan toolchain, then ~5k lines and 226 theorems; a cold build
    # is ~1–3 min, and a warm `.lake` (Actions cache misses, so a repeated run is cold
    # too) is a little less. No wiz/grail/tests build, so nothing else waits on it.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
        with:
          cachix-name: ${{ env.CACHIX_NAME }}
          lean: true
      - name: Typecheck STC, and check the proof is honest
        run: scripts/check-stc.sh

  # The `tests` subset's job: the shard matrix, unchanged in shape (one job per shard,
  # each a row of `.github/test-shards.json`). The matrix itself is a `lean` output: the
  # driver has to exist to list cases and split a shard. Every shard consumes the same
  # `lean` outputs (`wiz`, `tests`, `compiler-key`) and substitutes them from Cachix; a
  # fork, or a pull request with no PR cache, builds them here.
  tests:
    name: test (${{ matrix.shard.name }})
    needs: [changes, lean]
    if: needs.changes.outputs.shards != '[]'
    # A "heavy" shard (.github/test-shards.json) runs on the self-hosted runner whose
    # label is the repository variable WIZ_RUNNER_HEAVY (docs/ci-runner.md), when that is
    # set and the code is this repository's: a pull request from a fork never runs there
    # (it would run untrusted code on that machine) and uses GitHub's runner instead.
    # Unset (the default): every shard on ubuntu-latest, as before.
    runs-on: ${{ matrix.shard.heavy && vars.WIZ_RUNNER_HEAVY != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.WIZ_RUNNER_HEAVY || 'ubuntu-latest' }}
    # the groups are split into parts (test-shards.json) to keep each one short: library
    # into 12, since the measured shards were 55-85 min (one passed 90) at 8 parts
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.lean.outputs.matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
        with:
          cachix-name: ${{ env.CACHIX_NAME }}
          # Only a push to master gets the trusted token: pulls, merge-queue runs and
          # dispatch read the public cache anonymously.
          cachix-token: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && secrets.CACHIX_AUTH_TOKEN || '' }}
          # A pull request adds its own untrusted cache as a second substituter for this
          # job (its key is trusted here only); master never adds it.
          cachix-pr-name: ${{ github.event_name == 'pull_request' && env.CACHIX_PR_NAME || '' }}
          cachix-pr-token: ${{ github.event_name == 'pull_request' && secrets.CACHIX_PR_AUTH_TOKEN || '' }}
          # the tower group's "from source" case runs Lake, so that one shard needs the
          # elan toolchain (the others run only the store's binaries)
          lean: ${{ contains(toJSON(matrix.shard), 'tower') }}
      # The lean job's store paths, substituted from Cachix (same os/arch): master's
      # from the trusted cache, a pull request's from its PR cache when it was published.
      # A fork, or a PR with no PR token, builds them again here. On a `lib/`-only
      # change `lean` is still run (the matrix needs it), so its outputs are present;
      # the fallback covers a fork and an older run.
      - name: nix build (the store paths, from Cachix)
        id: nix
        run: |
          # The store paths the lean job published (master's pure ones; a pull
          # request's from its seeded `.lake` build). Asking for a store path
          # substitutes it from the caches directly — the derivation hash of a PR's
          # cached build cannot be recomputed here — and a fork (no PR cache) or a
          # missing path falls back to the derivation, as before.
          wiz='${{ needs.lean.outputs.wiz }}'
          tests='${{ needs.lean.outputs.tests }}'
          # the self-hosted programs are store paths too (perf H2), and nothing else in
          # this job demands them: without this line they stay strings and every case
          # that uses one fails to exec - or, in a group that turns any error into a
          # skip, disappears as "the selfhost compiler is unavailable".
          shc='${{ needs.lean.outputs.selfhost-compiler }}'
          shk='${{ needs.lean.outputs.selfhost-checker }}'
          if [ -z "$wiz" ] || [ -z "$tests" ] || ! nix build --no-link "$wiz" "$tests"; then
            nix build .#wiz .#tests --no-link -L
            wiz=$(nix path-info .#wiz)
            tests=$(nix path-info .#tests)
          fi
          if [ -n "$shc" ] && [ -n "$shk" ] && nix build --no-link "$shc" "$shk"; then
            echo "selfhost_compiler=$shc" >> "$GITHUB_OUTPUT"
            echo "selfhost_checker=$shk" >> "$GITHUB_OUTPUT"
          else
            # left empty on purpose: the tests step reads these outputs, so an empty value
            # is what makes the driver build the programs in its /tmp cache. Warning only
            # (the suite still runs), but the message has to be true - it used to say the
            # driver would build them while the tests step still had the un-realised paths
            # from `needs.lean.outputs` and the new pathExists guard then threw.
            echo "::warning title=selfhost::the self-hosted store paths are not substitutable; this shard will build them in /tmp"
            echo "selfhost_compiler=" >> "$GITHUB_OUTPUT"
            echo "selfhost_checker=" >> "$GITHUB_OUTPUT"
          fi
          echo "wiz=$wiz" >> "$GITHUB_OUTPUT"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          # `=scry-project` (and the other scry groups in the library shard) link against
          # the C# grammar: `scry/src/Scry/NativeLink.wiz` has `link_c ../../native/
          # tree-sitter-c-sharp/src/parser.c`. That out-link is gitignored, so a fresh
          # checkout has no grammar and the case fails on a missing file instead of
          # testing anything. Create it here, exactly as the scry workflow does; it is
          # substituted from Cachix, so this is a link, not a build.
          nix build .#tree-sitter-c-sharp -o scry/native/tree-sitter-c-sharp
          # the suite and its helpers name the checkout's binaries (`.lake/build/bin/wiz`,
          # `.lake/build/bin/grail`, `scripts/trust-ledger.sh`); point them at the store.
          # No Lake build and no .lake cache: this is a directory of symlinks.
          mkdir -p .lake/build/bin
          ln -sf "$wiz/bin/wiz" .lake/build/bin/wiz
          ln -sf "$wiz/bin/grail" .lake/build/bin/grail
          ln -sf "$tests/bin/tests" .lake/build/bin/tests
          echo "$wiz/bin" >> "$GITHUB_PATH"
          du -sh "$wiz" "$tests"
      # What the suite builds from Wiz programs, kept between runs: the elaboration cache
      # (`--cache`, which the grail-selfhost test uses), grail's `.grail` (the test's
      # build of the self-hosted checker) and — the fallback only, because `lean` normally
      # hands this job `--selfhost-compiler/--selfhost-checker` store paths — the
      # self-hosted checker and compiler that Tests/Elab.lean compiles under /tmp. The
      # /tmp programs are keyed by their source and the *driver's mtime only*
      # (Tests/Elab.lean: `hash (prog ++ stamp)`), and a Nix store path's mtime is a
      # constant, while the libraries they are compiled
      # against (`lib/Prelude.wiz`, `lib/IO.wiz`, `lib/Std.wiz`, `lib/Sys.wiz`) are read
      # from the working tree at build time. So the cache key carries those inputs too:
      # `selfhost/*.wiz` (the tables are `selfhost/Tables.wiz`) and `lib/*.wiz`, on top
      # of the compiler inputs (`compiler-key`). `restore-keys` stops at that hash, so a
      # Prelude change never restores a checker built from the old one; entries restored
      # under the same hash saw the same selfhost/lib sources, and both the elaboration
      # cache and the selfhost programs' inputs are then identical or content-addressed,
      # so a partial hit (other Wiz files) is safe.
      - name: Subset cache key (the tests subset)
        # `subset-v1-tests-wizlib-<os>-<arch>-<toolchain sha12>-<shard>-
        # <compiler-key>-<selfhost/lib hash>-<tests sha12>-<wizlib sha12>-<all Wiz
        # files hash>`.
        # The required components are the `tests` subset's sha and the toolchain; the
        # scope adds the shard, the driver's compiler key and the selfhost/lib inputs
        # whose programs the cache holds (a Prelude change must not restore a checker
        # built from the old one), and the suffix is the whole Wiz tree the shard saw.
        # `wizlib` is a second subset in the key because the cache reads `lib/`.
        id: subset-key
        shell: bash
        run: |
          # A pull request's entry is PR-scoped: master's `.cache/wiz` is never offered
          # to it (the trusted layer is the packaged Nix cache below), and its own
          # previous runs still match.
          prefix=""
          if [ "${{ github.event_name }}" = pull_request ]; then
            prefix="pr-${{ github.event.pull_request.number }}-"
          fi
          python3 scripts/ci.py subset-key tests --with wizlib \
            --scope "${prefix}${{ matrix.shard.name }}-${{ needs.lean.outputs.compiler-key }}-${{ hashFiles('selfhost/*.wiz', 'selfhost/Tables.wiz', 'lib/*.wiz') }}" \
            --suffix "${{ hashFiles('**/*.wiz') }}" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
      - name: Restore the Wiz build caches (writable; PR-scoped on a pull request)
        id: wiz-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/wiz
            .grail
            /tmp/wiz-selfhost-*
          key: ${{ steps.subset-key.outputs.key }}
          restore-keys: ${{ steps.subset-key.outputs.prefix }}
      - name: tests -- ${{ matrix.shard.name }}
        env:
          SELECT: ${{ matrix.shard.select }}
          JOBS: ${{ matrix.shard.jobs }}
          ALLOW_MISSING_DEPS: "${{ matrix.shard['allow-missing-deps'] }}"
          # the self-hosted programs from the `lean` job (perf H2); empty means the
          # driver builds them in its `/tmp` cache as before
          # the realised paths from this job's nix step (empty when realisation failed, in
          # which case the driver builds in /tmp); not `needs.lean.outputs`, which are
          # strings that may name paths this runner never substituted
          SELFHOST_COMPILER: ${{ steps.nix.outputs.selfhost_compiler }}
          SELFHOST_CHECKER: ${{ steps.nix.outputs.selfhost_checker }}
        run: |
          mapfile -t sel <<< "$SELECT"
          mkdir -p logs ~/.cache/wiz
          du -sh ~/.cache/wiz .grail /tmp/wiz-selfhost-* 2>/dev/null || true
          # The packaged `wiz` store path carries a Nix-built read-only elaboration
          # cache (`share/wiz/cache`, the same layer the wrappers add with
          # `--cache-ro`); the tests driver does not add it itself. It is a derivation
          # output substituted from Cachix (the lean job publishes `wiz`), not a
          # tarball in an Actions cache, and this job never writes it.
          ro=(--cache-ro "${{ steps.nix.outputs.wiz }}/share/wiz/cache" --cache-ro-unsigned)
          # A missing dependency is a failure (Tests.skipMissing) unless the shard is one
          # whose environment deliberately lacks an optional tool: only `library` sets
          # "allow-missing-deps" in .github/test-shards.json, for iverilog (the one Icarus
          # case) and the tower "from source" case's Lake toolchain. The opt-out is the
          # driver's **explicit flag** and nothing else - there is no
          # WIZ_ALLOW_MISSING_DEPS variable any more, because a variable that can turn a
          # failure into a skip is the same defect as a PATH that silently finds the wrong
          # compiler. Every skip the flag allows still needs an
          # .github/skip-allowlist.json entry (`scripts/ci.py check-skips`), so it cannot
          # hide an unexpected missing cc, node, yosys, ...
          allow=()
          if [ "$ALLOW_MISSING_DEPS" = "true" ]; then
            allow=(--allow-missing-deps)
          fi
          echo "allow-missing-deps: ${ALLOW_MISSING_DEPS:-false}"
          # A shard without "jobs" gets no `--jobs`: the driver already runs one case at
          # a time, and a case with an auto mode (`=selfhost-libdiff`) tells "not given"
          # from "--jobs 1" (`Tests.caseJobsGiven`).
          jobs=()
          if [ -n "$JOBS" ]; then jobs=(--jobs "$JOBS"); fi
          jobs_s="${jobs[*]-}"
          # The real `--cache-ro` path, not a placeholder: a shard's log is the only
          # place a cache miss (or a layer that was substituted from Cachix) can be
          # told apart from a source change, so it names the store path it read.
          echo "tests -- --cache ~/.cache/wiz --cache-ro ${ro[1]} ${jobs_s:+$jobs_s }${allow[*]-}${allow:+ }${sel[*]}"
          # The self-hosted programs are store paths from the `lean` job (perf H2): built
          # once there, substituted here, instead of each case's `/tmp` cache rebuilding
          # them from source on a fresh runner. Empty when `lean` produced none (a shard
          # can run without it), in which case the driver builds as before.
          shflags=()
          if [ -n "$SELFHOST_COMPILER" ] && [ -n "$SELFHOST_CHECKER" ]; then
            shflags=(--selfhost-compiler "$SELFHOST_COMPILER/bin/compiler" \
                     --selfhost-checker "$SELFHOST_CHECKER/bin/checker")
          else
            # Loud on purpose: the shard still runs, but it pays the `/tmp` build this
            # change exists to remove (perf H2), so a silent fallback would hide a
            # broken lean-job output for as long as nobody read the timings.
            echo "::warning title=selfhost::the lean job produced no self-hosted programs; this shard builds them in /tmp (perf H2)"
          fi
          # the Nix-built driver, exactly as `lake test -- …` would run it; every case's
          # time as JSON lines (scripts/ci.py summary and baseline read them)
          "${{ steps.nix.outputs.tests }}/bin/tests" --cache "$HOME/.cache/wiz" "${ro[@]}" "${allow[@]}" "${jobs[@]}" \
            "${shflags[@]}" \
            --timings "logs/${{ matrix.shard.name }}.jsonl" \
            --shard "${{ matrix.shard.name }}" "${sel[@]}" 2>&1 | tee "logs/${{ matrix.shard.name }}.log"
      - name: Save the Wiz build caches (PR-scoped on a pull request)
        # Only a shard whose tests passed reaches this step (the old `always()` wrote a
        # failed shard's cache). A shard that succeeds while another subset fails still
        # saves its own key, so the next run of this PR restores it.
        if: steps.wiz-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/wiz
            .grail
            /tmp/wiz-selfhost-*
          key: ${{ steps.subset-key.outputs.key }}
      - name: Summary
        if: always()
        run: |
          [ -f "logs/${{ matrix.shard.name }}.log" ] || exit 0
          shopt -s nullglob
          python3 scripts/ci.py summary "shard ${{ matrix.shard.name }}" logs/${{ matrix.shard.name }}.log logs/${{ matrix.shard.name }}.jsonl >> "$GITHUB_STEP_SUMMARY"
          # The cases' effective wall limits (`--timings` "limit", printed in every case
          # line): a case at 80 % of its limit is a warning annotation, so raising a
          # timeout that never took effect (an option after the subcommand, 9ee24e52b)
          # is visible instead of looking like a fix.
          python3 scripts/ci.py timings logs/${{ matrix.shard.name }}.jsonl >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-log-${{ matrix.shard.name }}
          path: logs/
          if-no-files-found: ignore
          # always uploaded (the `CI result` job sums them up), but kept briefly
          retention-days: 3

  # (11s) The Wiz→wasm page modules as Nix derivations (`packages.wiz-web`,
  # `packages.wiz-playground`, `packages.wiz-playground-ui` and `packages.wiz-source-ui`;
  # flake.nix), built once here and published to Cachix. They used to be built inside
  # `web`'s test step (95 % of
  # its 608 s, with `wasm-opt -O2`'s 8–10 GiB peak as the tail that once reached 55 min)
  # and again in every `docs` job on a push; `web` now takes them from here through
  # `web/modules-from-store.sh`, and `docs` takes the **pure** modules as `.#pages`
  # inputs. On a seeded run those are not the modules this job built, so the docs job
  # builds them (or substitutes them from master's cache) itself. The reader's module is
  # also what `scry web --ui` puts in the published `/source/` bundle.
  #
  # It is not in `lean`: a 10-minute wasm build there would sit on the shards' critical
  # path. Here it runs beside the shards. It waits for `lean` when that runs, so its
  # `wiz` is a substitute (if `lean` were skipped, the unchanged `wiz`/`wiz-unwrapped`
  # substitute from Cachix too).
  #
  # It owns no Actions cache: the modules are Nix store paths, published to the PR
  # Cachix cache and reused path by path on a later run with the same `web/` inputs.
  # The Lake seed it restores is the master/PR seed input, not a subset output.
  wasm:
    name: wasm modules
    needs: [changes, lean]
    if: >-
      !cancelled() && needs.changes.outputs.web == 'true' &&
      (needs.lean.result == 'success' || needs.lean.result == 'skipped')
    runs-on: ubuntu-latest
    # one cold module (~10 min: the playground engine) or seconds on a Cachix hit.
    # 75, not 45: run 44795685025 hit the 45-minute limit after 45m15s on a cold
    # Cachix miss (the nix build of both derivations), and GitHub reports a timed-out
    # job as "The operation was canceled." — the annotation is the timeout.
    timeout-minutes: 75
    # The paths it built (and pushed). A pull request's are *seeded* derivations:
    # their store paths differ from `.#wiz-web` and friends, so `web` must take these,
    # not the pure attrs (which can never match). `docs` takes the pure attrs; see the
    # job comment above.
    outputs:
      web: ${{ steps.nix.outputs.web }}
      playground: ${{ steps.nix.outputs.playground }}
      ui: ${{ steps.nix.outputs.ui }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
        with:
          cachix-name: ${{ env.CACHIX_NAME }}
          # Only a push to master gets the trusted token. A pull request reads the trusted
          # cache anonymously and instead adds the untrusted PR cache, which is where the
          # `lean` job publishes `wiz`/`wiz-unwrapped`: without it every web derivation
          # rebuilt `wiz-unwrapped` from source (the cold 45-minute miss).
          cachix-token: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && secrets.CACHIX_AUTH_TOKEN || '' }}
          cachix-pr-name: ${{ github.event_name == 'pull_request' && env.CACHIX_PR_NAME || '' }}
          cachix-pr-token: ${{ github.event_name == 'pull_request' && secrets.CACHIX_PR_AUTH_TOKEN || '' }}
          lean: false
      - name: Subset cache key (the PR's lean seed)
        id: lean-subset-key
        if: github.event_name == 'pull_request'
        shell: bash
        run: python3 scripts/ci.py subset-key lean >> "$GITHUB_OUTPUT"
      - name: Restore the PR's lean subset cache (a pull request)
        # The PR's own previous `withLakeCache` `.lake` (saved by the `lean` job); this
        # job runs after it. Untrusted and PR-scoped, like the `lean` job's first choice.
        id: lean-seed
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .subset-cache/lean
          key: ${{ steps.lean-subset-key.outputs.key }}
          restore-keys: ${{ steps.lean-subset-key.outputs.prefix }}
      - name: Trusted Lake seed (the base commit's flake output, from Cachix)
        # The base commit's `.#lake-seed`, substituted from the trusted Cachix exactly
        # as in the `lean` job; `empty` means the cache does not hold it.
        id: lake-trusted
        if: github.event_name == 'pull_request' && steps.lean-seed.outputs.cache-hit != 'true'
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          dir="$RUNNER_TEMP/lake-base"
          rm -rf "$dir"; mkdir -p "$dir"
          git fetch --no-tags --depth=1 origin "$base"
          git archive "$base" | tar -x -C "$dir"
          seed=$(scripts/lake-cache.sh trusted "$dir")
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "trusted seed: $seed"
      - name: nix build (wiz-web, wiz-playground, wiz-playground-ui, wiz-source-ui)
        id: nix
        run: |
          # They share `wiz`, the emscripten closure and mini-gmp; the playground engine is
          # the expensive one (`--opt 1` in flake.nix, because `wasm-opt`'s -O2 peak does
          # not fit a 16 GB runner). `--max-jobs 1`: one at a time, for the same reason.
          # `wiz` and emscripten are substitutes.
          if [ "${{ github.event_name }}" = pull_request ]; then
            # A pull request builds the four web packages **with the lean job's seeded
            # compiler**, through `lib.webWith (builtins.storePath <wiz>)`. Without it
            # every derivation falls back to the pure `.#wiz`, which instantiates
            # `wiz-unwrapped`: run 45433827374 spent 31 minutes on
            # `wiz-unwrapped-0.1.0.drv` (17:26:10-17:57:23), started `wiz-0.1.0.drv` at
            # 17:57:23, and the job was killed at the 75-minute wall before it finished.
            # The seeded path is a store input, so Nix substitutes it instead.
            wiz='${{ needs.lean.outputs.wiz }}'
            if [ -z "$wiz" ]; then
              echo "::error title=wasm::the lean job produced no wiz store path"
              exit 1
            fi
            if ! nix build --no-link "$wiz" --option max-jobs 0; then
              echo "::error title=wasm::the seeded wiz $wiz is not substitutable; refusing a cold build"
              exit 1
            fi
            sys=$(nix eval --impure --raw --expr builtins.currentSystem)
            expr="let f = builtins.getFlake \"$PWD\"; in f.lib.\"$sys\".webWith (builtins.storePath \"$wiz\")"
            # Prove on the derivation graph that none of the four builds a `wiz`, before
            # building any of them (the same guard `packages` uses for tower).
            for attr in wiz-web wiz-playground wiz-playground-ui wiz-source-ui; do
              drv=$(nix eval --impure --raw --expr "($expr).$attr.drvPath")
              nix derivation show "$drv" > "$RUNNER_TEMP/$attr.json"
              python3 scripts/check-seeded-wiz.py "$RUNNER_TEMP/$attr.json" "$wiz"
            done
            # One `nix build -L --print-out-paths` per attribute, so each variable is *the
            # path that build produced*. Two earlier versions failed here: `nix build` over
            # four attrs prints paths sorted by hash, not in argument order (so `sed -n 1p`
            # named the wrong module — `web` then failed with "…wiz-source-ui… has no
            # wiz-infoview.mjs", run 45499005660), and `nix eval …outPath` returns the
            # derivation's *predicted* output, which need not exist for `--no-link`
            # (`du: cannot access /nix/store/…-wiz-web-0.1.0`, run #1661).
            web=$(nix build --impure --no-link --print-out-paths --max-jobs 1 -L --expr "($expr).wiz-web")
            playground=$(nix build --impure --no-link --print-out-paths --max-jobs 1 -L --expr "($expr).wiz-playground")
            ui=$(nix build --impure --no-link --print-out-paths --max-jobs 1 -L --expr "($expr).wiz-playground-ui")
            source_ui=$(nix build --impure --no-link --print-out-paths --max-jobs 1 -L --expr "($expr).wiz-source-ui")
          else
            nix build .#wiz-web .#wiz-playground .#wiz-playground-ui .#wiz-source-ui --no-link -L --max-jobs 1
            web=$(nix path-info .#wiz-web)
            playground=$(nix path-info .#wiz-playground)
            ui=$(nix path-info .#wiz-playground-ui)
            source_ui=$(nix path-info .#wiz-source-ui)
          fi
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "playground=$playground" >> "$GITHUB_OUTPUT"
          echo "ui=$ui" >> "$GITHUB_OUTPUT"
          echo "source_ui=$source_ui" >> "$GITHUB_OUTPUT"
          echo "wiz-web: $web"; echo "wiz-playground: $playground"; echo "wiz-playground-ui: $ui"
          echo "wiz-source-ui: $source_ui"
          du -sh "$web" "$playground" "$ui" "$source_ui"
      - name: Publish the store paths to Cachix (master)
        # `web` and `docs` substitute these; the same token rule as the compiler's push:
        # only a push to master writes the trusted cache. A merge-queue run and a pull
        # request publish nothing here (a PR writes its own untrusted cache below).
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -z "$CACHIX_AUTH_TOKEN" ]; then
            echo "::error title=Cachix::CACHIX_AUTH_TOKEN is empty on a run that must publish"
            exit 1
          fi
          nix develop .#ci --command env CACHIX_AUTH_TOKEN="$CACHIX_AUTH_TOKEN" cachix push "$CACHIX_NAME" \
            ${{ steps.nix.outputs.web }} ${{ steps.nix.outputs.playground }} ${{ steps.nix.outputs.ui }} ${{ steps.nix.outputs.source_ui }}
      - name: Publish the store paths to the PR cache
        # A pull request writes only its own untrusted cache, with its own token. If the
        # repository variable or secret is absent (or this is a fork), nothing is
        # published: `web` builds the modules itself.
        if: github.event_name == 'pull_request'
        env:
          CACHIX_PR_AUTH_TOKEN: ${{ secrets.CACHIX_PR_AUTH_TOKEN }}
        run: |
          if [ -z "$CACHIX_PR_NAME" ] || [ -z "$CACHIX_PR_AUTH_TOKEN" ]; then
            echo "::warning title=Cachix::no CACHIX_PR_AUTH_TOKEN: the modules are not published"
            exit 0
          fi
          nix develop .#ci --command env CACHIX_AUTH_TOKEN="$CACHIX_PR_AUTH_TOKEN" cachix push "$CACHIX_PR_NAME" \
            ${{ steps.nix.outputs.web }} ${{ steps.nix.outputs.playground }} ${{ steps.nix.outputs.ui }} ${{ steps.nix.outputs.source_ui }}

  # (11s, ci-01) The playground and the site's JavaScript, on every pull request that
  # touches `web/**` (and on a push, where `changes --all` sets web=true). `web/test.sh`
  # runs its browser-free half on the two modules `wasm` built: the search box,
  # the benchmark page and site check, the playground's language client and self-hosted
  # server shim (against stubs), the infoview's and playground's modules under Node, and a
  # `wiz doc` page's module. `WIZ_WEB_NO_BROWSER` stops it before the Chromium half
  # (`web/chrome_test.mjs` and `web/doc_chrome_test.mjs`: a served page over the DevTools
  # protocol), which still needs a browser and stays local. The framework's browser half
  # is a Node DOM double (`web/framework/test.sh`), so it runs here too. This job is in
  # `result`: a missing module or a failing web test fails `CI result`. It owns no
  # Actions cache: it builds no module (`wasm` did) and its product is the check result.
  web:
    name: web
    # Ordered behind `lean` when it runs, so `nix build .#wiz` substitutes this commit's
    # store path from Cachix instead of rebuilding it here (and instead of competing with
    # the build for the runner). A `lean` skip must not skip this job, hence the explicit
    # result check rather than a bare `needs`.
    needs: [changes, lean, wasm]
    if: >-
      !cancelled() && needs.changes.outputs.web == 'true' &&
      (needs.lean.result == 'success' || needs.lean.result == 'skipped') &&
      needs.wasm.result == 'success'
    runs-on: ubuntu-latest
    # 45 min: the Node tests are ~1 min, but the landing step's `nix build
    # .#wiz-landing-ui` pulls `wiz-landing-ui`, `wiz` and **`wiz-unwrapped`** into the
    # evaluation, and on a seeded run none of them is in the cache - measured on run
    # 45376147953: three derivations to build plus 683 MiB of chromium/cadical to fetch,
    # against a 30-minute wall. `wiz` itself comes from `lean` (see the `nix build`
    # step); the landing module does not, so this job pays for a cold Lean build of the
    # compiler to build one `.mjs`. Raising the wall is the honest stopgap; making
    # `wasm` publish `wiz-landing-ui` so this step substitutes is the real fix.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
        with:
          cachix-name: ${{ env.CACHIX_NAME }}
          # Only a push to master gets the trusted token: a pull request reads the
          # trusted cache anonymously and adds its own untrusted cache instead (its
          # `lean` publishes there when the PR changed code).
          cachix-token: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && secrets.CACHIX_AUTH_TOKEN || '' }}
          cachix-pr-name: ${{ github.event_name == 'pull_request' && env.CACHIX_PR_NAME || '' }}
          cachix-pr-token: ${{ github.event_name == 'pull_request' && secrets.CACHIX_PR_AUTH_TOKEN || '' }}
          lean: false
      - name: nix build (wiz, from Cachix)
        id: nix

        run: |
          # the lean job's wiz: a pull request's from its seeded `.lake` build (a
          # store path substitutes directly); a miss falls back to the derivation
          wiz='${{ needs.lean.outputs.wiz }}'
          if [ -z "$wiz" ] || ! nix build --no-link "$wiz"; then
            wiz=$(nix build .#wiz --no-link --print-out-paths)
          fi
          echo "wiz=$wiz" >> "$GITHUB_OUTPUT"
          du -sh "$wiz"
      - name: The Wasm modules (from Cachix; wasm built them)
        id: modules
        env:
          # the producer's seeded paths (a pull request's differ from the pure attrs).
          # No trusted Cachix token here: a same-repo PR could read it from the
          # environment, and only master may write the trusted cache. A PR's miss takes
          # the script's build-them-here fallback (as a fork's does).
          WIZ_MODULES_WEB: ${{ needs.wasm.outputs.web }}
          WIZ_MODULES_PLAYGROUND: ${{ needs.wasm.outputs.playground }}
          WIZ_MODULES_UI: ${{ needs.wasm.outputs.ui }}
        run: sh web/modules-from-store.sh
      - name: The browser-free half of web/test.sh
        env:
          WIZ: ${{ steps.nix.outputs.wiz }}/bin/wiz
          WIZ_WEB_NO_BROWSER: "1"
          # the module directories, copied into web/test.sh's OUT (no build)
          WIZ_WEB_FROM: ${{ steps.modules.outputs.web }}
          WIZ_PLAYGROUND_FROM: ${{ steps.modules.outputs.playground }}
          WIZ_PLAYGROUND_UI_FROM: ${{ steps.modules.outputs.ui }}
        run: sh web/test.sh
      - name: The React framework's browser half (a Node DOM double)
        env:
          WIZ: ${{ steps.nix.outputs.wiz }}/bin/wiz
        run: sh web/framework/test.sh
      - name: The playground's output pane as a Loom component
        env:
          WIZ: ${{ steps.nix.outputs.wiz }}/bin/wiz
        run: sh web/playground-loom-test.sh
      - name: The landing page (snippets, carousel, island, Chromium)
        # The snippet/highlighter agreement and the page's contract need no browser;
        # this also drives the no-JS load, the carousel's keys and the Loom island's
        # adoption in headless Chromium. The module is a Nix derivation, so Emscripten
        # is not an input of this job.
        env:
          WIZ: ${{ steps.nix.outputs.wiz }}/bin/wiz
        run: |
          ui=$(nix build .#wiz-landing-ui --no-link --print-out-paths --max-jobs 1)
          chrome=$(nix shell --inputs-from . nixpkgs#chromium -c sh -c 'command -v chromium')
          sh web/landing/test.sh --ui "$ui" --require-ui --chrome "$chrome"

  # (11s) The published site, as the artifact `wiz-docs`: on every event but the
  # schedule, so a pull request builds it too. Kept 3 days (artifact storage). The tree is
  # the landing page at the root, the standard library's documentation (`wiz doc`,
  # scroll) under `docs/`, the static playground under `playground/` and the source reader
  # under `source/`; the Wasm modules make the docs' signatures interactive, run
  # the playground and mount the reader. This job and `docs check` are both in `result`,
  # whenever `code` and `web` changed, so a site that does not build or check is red
  # before merge as well as on master (review ci-02). `deploy-docs` publishes the
  # artifact to GitHub Pages on a master push and stays outside `result`: a Pages outage
  # is not a defect in the commit (docs/building.md, "Documentation site").
  docs:
    name: docs pages
    needs: [lean, wasm]
    # Built on a pull request as well as a push: the source reader is where a
    # `/source/` regression shows up before merge, and it cost a master red to discover
    # that when this was push-only. Only the *deploy* to Pages stays merge-action-only
    # (`deploy-docs`).
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # The derivations do the work now: `.#pages` is `.#docs-site` (the site's chrome over
    # `.#docs-lib`'s API pages) plus the source reader built from `.#scry` and
    # `.#wiz-source-ui`. Cachix substitutes what it holds and the job runs no build command
    # of its own, but a pull request's `.#docs-lib` names the pure `wiz` (not the seeded
    # build its `lean` job made), so that chain can still compile here until a seeded
    # `pagesWith` lands.
    # 60 min is the cold case only (a `lib/` change with no cache).
    timeout-minutes: 60
    outputs:
      path: ${{ steps.pages.outputs.path }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
        with:
          cachix-name: ${{ env.CACHIX_NAME }}
          # Same cache rule as the wasm job: the PR cache carries `wiz`; the trusted
          # token is for a master push only.
          cachix-token: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && secrets.CACHIX_AUTH_TOKEN || '' }}
          cachix-pr-name: ${{ github.event_name == 'pull_request' && env.CACHIX_PR_NAME || '' }}
          cachix-pr-token: ${{ github.event_name == 'pull_request' && secrets.CACHIX_PR_AUTH_TOKEN || '' }}
          lean: false
      - name: The site and the source reader (nix build .#pages)
        # One derivation, so the API pages (`.#docs-lib`), the site chrome
        # (`.#docs-site`), the analysis CLI (`.#scry`) and the reader's runtime
        # (`.#wiz-source-ui`) are inputs with hashes rather than steps in this job. The
        # build runs the site contract (`web/check-site.sh`) itself; the second job
        # checks the published tree again and drives the reader in Chromium.
        id: pages
        run: |
          p=$(nix build .#pages --no-link --print-out-paths)
          echo "path=$p" >> "$GITHUB_OUTPUT"
          echo "pages: $p"
          du -sh "$p"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wiz-docs
          path: ${{ steps.pages.outputs.path }}
          retention-days: 3

  docs_check:
    name: docs check (site contract + source reader)
    needs: [docs]
    # A separate job so the overview shows *building* the site and *checking* it as two
    # verdicts: a broken page and a broken reader still report apart, and the check
    # consumes exactly what Pages will publish (the artifact), not a tree rebuilt here.
    if: needs.docs.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
        with:
          cachix-name: ${{ env.CACHIX_NAME }}
          lean: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wiz-docs
          path: doc-site
      - name: The site has its entry points, /source/, and the landing's links resolve
        env:
          SITE_REQUIRE_SOURCE: "1"
        run: sh web/check-site.sh doc-site
      - name: The published source reader in headless Chromium
        # The bundle is the tree under doc-site/source, not a second export: this checks
        # the artifact deploy-docs will publish. The test serves it and loads it twice
        # (JavaScript off: the SSR; on: mount, hover, #/f/<id>).
        run: |
          # Use the pinned nixpkgs chromium: the runner's system chromium is often a
          # snap stub that never opens a DevTools target.
          chrome=$(nix shell --inputs-from . nixpkgs#chromium -c sh -c 'command -v chromium')
          node web/source_chrome_test.mjs "$chrome" doc-site/source

  # (11s) Publish the `wiz-docs` artifact to GitHub Pages. The artifact's tree, and so
  # the site's URL layout, is:
  #   https://wiz-pl.github.io/wiz/                     the landing page (web/landing/)
  #   https://wiz-pl.github.io/wiz/docs/                the docs index (wiz doc's index.html)
  #   https://wiz-pl.github.io/wiz/docs/api.html        the API index (every declaration)
  #   https://wiz-pl.github.io/wiz/docs/Prelude.html    one page per module, plus A.B.json
  #   https://wiz-pl.github.io/wiz/playground/          the static playground (stage 11ab)
  #   https://wiz-pl.github.io/wiz/source/              the source reader (`scry web`, #/f/<id>)
  # Every link is relative, so the same tree works at the project-site prefix above and
  # at a custom domain root.
  # A repository has ONE Pages site and every deployment replaces the whole tree, so this
  # job is the only Pages publisher. The performance site (when it lands) goes under
  # `/perf/` in the same artifact: add it to `.#pages` (a `perf/` subtree of the
  # derivation's output), or add it here with a checkout, rather than enabling a second
  # deploy job (which would delete the site). The repository's Pages source must be
  # "GitHub Actions" once (Settings -> Pages; docs/building.md, "Documentation site");
  # until then this job fails and the site keeps its last published tree. It is not in
  # `result`: a Pages outage does not fail the suite.
  deploy-docs:
    name: deploy docs to Pages
    needs: [docs, docs_check]
    # Merge action only: a push to master. The site is *built* on every pull request now;
    # publishing it is the one step that belongs to the merge. The contract check and the
    # reader ship with it: a green build whose site or reader failed does not publish.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # 10 min: upload the artifact and deploy it; no build
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # deployments are serialised: `cancel-in-progress: false` lets an older deploy finish
    # and the newer one replace it, so the site ends at the newest master commit
    concurrency:
      group: pages
      cancel-in-progress: false
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wiz-docs
          path: doc-site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: doc-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # One check for branch protection, and the whole suite's summary.
  result:
    name: CI result
    # `docs` and `docs check` are needs here and are required by `check` exactly when
    # `want_docs` holds (a code change with `web` set, on every event but the schedule):
    # that is what makes a broken page or reader red, on a pull request before merge and
    # on master (review ci-02). On a merge-queue entry `web` is true, so they are
    # required there too; when `want_docs` is false the two are `skipped` and accepted.
    # `packages` and `runtime` are required exactly when their subset changed; `lean`
    # whenever `code` did (it carries the matrix), and `tests` whenever `shards` is not
    # empty.
    needs: [changes, docs_style, name_collisions_reachable, prelude_drift, docs_examples, source-tarball, attest, lean, lake_seed, trust_ledger, stc, tests, wasm, web, docs, docs_check, packages, runtime]
    if: always() && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # 10 min: download the logs, the summary, the skip lint and the balance check
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # this run's job walls, for the shard-balance gate
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: |
            scripts
            .github
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.tests.result != 'skipped' # no shard ran: nothing to sum up
        with:
          pattern: test-log-*
          path: logs
          merge-multiple: true
      - name: Summary
        if: needs.tests.result != 'skipped' # no shard ran: nothing to sum up
        shell: bash
        run: |
          shopt -s nullglob
          logs=(logs/*.log logs/*.jsonl)
          python3 scripts/ci.py summary "Wiz test suite (${{ needs.lean.outputs.tree }} tree)" "${logs[@]}" >> "$GITHUB_STEP_SUMMARY"
          # all shards' case times in one file, for `scripts/ci.py baseline`
          mkdir -p timings
          cat logs/*.jsonl > timings/timings.jsonl 2>/dev/null || true
      # A green run must have tested something. Fails when a group skipped wholesale
      # (unless .github/skip-allowlist.json allows it, with a reason and an owner), when
      # a skip names a tool the dev shell must provide (cc, GMP, GC, yosys, node, nix,
      # …), when a `--allow-missing-deps` shard recorded a missing dependency that the
      # allow-list does not name, or when a group's unexplained skipped ratio (over its
      # cases in every shard) is over 25%. The self-test runs first, so the rule itself
      # is checked on synthetic logs without the suite.
      - name: Skips are explained
        if: needs.tests.result != 'skipped'
        shell: bash
        run: |
          python3 scripts/ci.py check-skips --self-test
          shopt -s nullglob
          logs=(logs/*.log logs/*.jsonl)
          if [ ${#logs[@]} -eq 0 ]; then
            echo "::error title=Skips::no test logs: a green run that wrote no test log tested nothing"
            exit 1
          fi
          python3 scripts/ci.py check-skips "${logs[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.tests.result != 'skipped' # no shard ran: nothing to sum up
        with:
          name: test-timings
          path: timings/timings.jsonl
          if-no-files-found: ignore
          # master's feed `scripts/ci.py baseline` (docs/building.md); others are short-lived
          retention-days: ${{ github.event_name == 'push' && 7 || 2 }}
      # The shards stay balanced (docs/building.md, "Shard balance"): the longest shard's
      # job wall must be within 1.5x the median wall, every split shard's cases must be in
      # the baseline, and two parts must not build the same program. Wall, not summed case
      # seconds: a shard that runs cases in parallel ("jobs": N) has a wall well below its
      # case sum, so the case-sum ratio alone would call a short job the tail. It is a
      # warning everywhere but a push to master, where `--strict` makes drift a failure:
      # as a warning it stayed stale for three current runs (wiz-notes/ci-profile.md). A
      # run whose tests all passed still uploads the regenerated baseline
      # (`test-timings-baseline`), including when it is the strict step that failed.
      - name: Shard balance
        id: balance
        if: needs.tests.result != 'skipped' # no shard ran: nothing to sum up
        continue-on-error: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/master') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          rm -f test-timings.json
          # This run's job list, for the `tests --` step's wall. Without it (the API call
          # failed) balance falls back to summed case seconds and says so.
          jobs=()
          if gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?filter=latest&per_page=100" > jobs.json.tmp 2>/dev/null && mv jobs.json.tmp jobs.json; then
            jobs=(--jobs-json jobs.json)
          else
            rm -f jobs.json.tmp jobs.json
            echo "::warning title=Shard balance::no job list from the API; the gate falls back to summed case seconds"
          fi
          set +e
          python3 scripts/ci.py balance --factor 1.5 --strict --baseline-out test-timings.json "${jobs[@]}" logs/*.jsonl >> "$GITHUB_STEP_SUMMARY"
          rc=$?
          set -e
          if [ -f test-timings.json ] && [ "${{ github.event_name }}" = push ] && [ "${{ needs.tests.result }}" = success ]; then
            echo "refresh=true" >> "$GITHUB_OUTPUT"
            cmd="gh run download ${{ github.run_id }} -R ${{ github.repository }} -n test-timings-baseline -D .github"
            echo "::warning title=Shard balance::the test-timings baseline drifted; to apply this run's: $cmd"
            { echo; echo "To apply it (then commit .github/test-timings.json in a PR):"; echo; echo '```'; echo "$cmd"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $rc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.balance.outputs.refresh == 'true'
        with:
          name: test-timings-baseline
          path: test-timings.json
          retention-days: 7
      - name: Verdict
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # What a red run is, in one place a phone can read: the failed jobs, by name and
          # link, at the top of the summary - before the per-job result lines below.
          failed=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?filter=latest&per_page=100" \
            --jq '[.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out")]
                  | "\(length) job(s) did not pass:\n" + (map("- **\(.name)** — \(.conclusion): \(.html_url)") | join("\n"))' 2>/dev/null || true)
          if [ -n "$failed" ]; then
            { echo "## Red: $failed"; echo; } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=CI::$(printf '%s' "$failed" | head -1)"
          fi
          echo "changes: ${{ needs.changes.result }} (code: ${{ needs.changes.outputs.code }}, docs: ${{ needs.changes.outputs.docs }}, web: ${{ needs.changes.outputs.web }}, stc: ${{ needs.changes.outputs.stc }}, shards: ${{ needs.changes.outputs.shards }})"
          echo "subsets: lean=${{ needs.changes.outputs.subset_lean }}, runtime=${{ needs.changes.outputs.subset_runtime }}, wizlib=${{ needs.changes.outputs.subset_wizlib }}, packages=${{ needs.changes.outputs.subset_packages }}, tests=${{ needs.changes.outputs.subset_tests }}, docs=${{ needs.changes.outputs.subset_docs }}"
          echo "docs style: ${{ needs.docs_style.result }}"
          echo "prelude drift: ${{ needs.prelude_drift.result }}"
          echo "docs examples: ${{ needs.docs_examples.result }}"
          echo "source tarball: ${{ needs['source-tarball'].result }}"
          echo "attestation: ${{ needs.attest.result }}"
          echo "lean: ${{ needs.lean.result }}, lake seed: ${{ needs.lake_seed.result }}, trust ledger: ${{ needs.trust_ledger.result }}, stc: ${{ needs.stc.result }}, tests: ${{ needs.tests.result }}, wasm modules: ${{ needs.wasm.result }}, web: ${{ needs.web.result }}, docs: ${{ needs.docs.result }}"
          echo "packages: ${{ needs.packages.result }}, runtime: ${{ needs.runtime.result }}"
          # the path filter must have run; a job it skipped is not a failure, but outside
          # pull requests (and whenever the filter wants them) every job must succeed
          [ "${{ needs.changes.result }}" = success ] || exit 1
          code="${{ needs.changes.outputs.code }}"
          docs="${{ needs.changes.outputs.docs }}"
          web="${{ needs.changes.outputs.web }}"
          stc="${{ needs.changes.outputs.stc }}"
          want_tests=$([ "${{ needs.changes.outputs.shards }}" != "[]" ] && echo true || echo false)
          # the two split jobs are required exactly when their subset changed (the
          # `changes` job's boolean and the job's `if:` are the same condition)
          want_packages=$([ "$code" = true ] && [ "${{ needs.changes.outputs.subset_packages }}" = true ] && echo true || echo false)
          want_runtime=$([ "$code" = true ] && [ "${{ needs.changes.outputs.subset_runtime }}" = true ] && echo true || echo false)
          # the metatheory library is checked for an STC edit and for any change to the
          # default build (a toolchain or lakefile bump can break it too)
          want_stc=false
          if [ "$code" = true ] || [ "$stc" = true ]; then want_stc=true; fi
          # The site is built and checked on a pull request as well as a push (the source
          # reader is where a `/source/` regression shows up), so it is required whenever
          # it could run: `lean` ran (the job needs it), the `web` filter matched (the
          # `wasm` job, which `docs` also needs, only runs then), and the event is not the
          # schedule. `deploy-docs` stays out of the gate: a Pages outage is not a defect.
          want_docs=$([ "$code" = true ] && [ "${{ needs.changes.outputs.web }}" = true ] && [ "${{ github.event_name }}" != schedule ] && echo true || echo false)
          # The cold trusted seed is a master push's job only (it publishes the trusted
          # store path); another event's seeded build falls back to a cold build, so the
          # seed job is not required there.
          want_seed=$([ "${{ github.event_name }}" = push ] && [ "${{ github.ref }}" = refs/heads/master ] && echo true || echo false)
          # a docs-only change has no lean job, so `docs_examples` builds wiz and checks
          # the snippets; a code change runs the same check in `lean`
          want_docs_examples=$([ "$code" = false ] && [ "$docs" = true ] && echo true || echo false)
          check() { # NAME RESULT WANTED
            if [ "$3" = true ]; then [ "$2" = success ] || { echo "$1: $2 (needed)"; exit 1; }
            else [ "$2" = success ] || [ "$2" = skipped ] || { echo "$1: $2"; exit 1; }; fi
          }
          check "docs style" "${{ needs.docs_style.result }}" true
          check "name collisions (reachable)" "${{ needs.name_collisions_reachable.result }}" true
          check "prelude drift" "${{ needs.prelude_drift.result }}" true
          check "docs examples" "${{ needs.docs_examples.result }}" "$want_docs_examples"
          check "source tarball" "${{ needs['source-tarball'].result }}" "$code"
          check "attestation" "${{ needs.attest.result }}" true
          check lean "${{ needs.lean.result }}" "$code"
          # the cold trusted seed only runs on a push to master; a PR's seeded build
          # falls back to the cold build when it is missing, so it is not required there
          check "lake seed" "${{ needs.lake_seed.result }}" "$want_seed"
          check "trust ledger" "${{ needs.trust_ledger.result }}" "$code"
          check "STC metatheory" "${{ needs.stc.result }}" "$want_stc"
          check tests "${{ needs.tests.result }}" "$want_tests"
          # the two page modules are a prerequisite of `web` (and of `docs`, which needs
          # `wasm`): a failure here is red even though `web` then skips
          check "wasm modules" "${{ needs.wasm.result }}" "$web"
          # a change to web/** must build the playground and pass its Node tests; the
          # job is skipped (and that is fine) only when the filter does not want it
          check web "${{ needs.web.result }}" "$web"
          check docs "${{ needs.docs.result }}" "$want_docs"
          check "docs check" "${{ needs.docs_check.result }}" "$want_docs"
          check packages "${{ needs.packages.result }}" "$want_packages"
          check runtime "${{ needs.runtime.result }}" "$want_runtime"

  # The three-stage bootstrap fixpoint (scripts/fixpoint.sh): stage-1 C = stage-2 C =
  # stage-3 C. Scheduled runs use the default branch (master). This weekly job stays on
  # ubuntu-latest as the fallback; the nightly .github/workflows/fixpoint.yml is the
  # opt-in one on the self-hosted runner.
  fixpoint:
    name: bootstrap fixpoint
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.fixpoint)
    runs-on: ubuntu-latest
    # 180 min: three self-hosting stages with Lake on ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
        with:
          cachix-name: ${{ env.CACHIX_NAME }}
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # the fixpoint still builds with Lake (scripts/fixpoint.sh)
          lean: true
      - name: Cache the Lake build and the elaboration cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .lake
            ~/.cache/wiz
          key: fixpoint-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('lakefile.lean', '**/*.lean', 'selfhost/*.wiz', 'lib/*.wiz') }}
          restore-keys: fixpoint-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Fixpoint
        run: scripts/fixpoint.sh .lake/fixpoint 2>&1 | tee fixpoint.log
      - name: Summary
        if: always()
        shell: bash
        run: |
          { echo "### Bootstrap fixpoint"; echo; echo '```'; grep -E 'FIXPOINT|^==|^stage [0-9]|^   |^total|^timings|^FAILED' fixpoint.log || echo "(no result)"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
