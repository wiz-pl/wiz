# The tag `nightly` (stage 26g): what `tower default nightly` installs. It moves to a master
# commit only when the CI workflow succeeded on it (master can break with only green PRs:
# two PRs green alone, in semantic conflict), and only once release.yml has published that
# commit's snapshot-<sha> (it waits for it; release.yml runs alongside CI). A snapshot of a
# red commit may exist: pins name it explicitly, nightly never points at it.
name: nightly

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

concurrency:
  # One at a time, in order, never cancelled: a late (older) run is made harmless by the
  # forward-only check in release-snapshots.sh, and it still moves nightly for its commit.
  group: nightly
  cancel-in-progress: false

# Least privilege: moving the `nightly` tag and replacing the nightly release's assets
# needs write; `actions: read` is for asking whether release.yml still runs on the commit.
permissions:
  contents: write # moving the tag, replacing the nightly release's assets
  actions: read # whether release.yml still runs on the commit

jobs:
  nightly:
    name: move nightly to a commit whose CI passed
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    # 75 min: wait up to 3600 s for the snapshot, then two release API calls
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: scripts
      - name: nightly -> the snapshot of ${{ github.event.workflow_run.head_sha }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          NIGHTLY_WAIT: "3600"
        run: scripts/release-snapshots.sh nightly "$SHA"
