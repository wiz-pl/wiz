# The three-stage bootstrap fixpoint on the self-hosted runner.
#
# `scripts/fixpoint.sh` builds the self-hosted compiler once with Lean and then compiles
# the toolchain three times (one C stage per compile), comparing self1.c, self2.c and
# self3.c byte for byte. It runs in reference-counting mode (`--rc`, the script's default
# and the release's mode). It declares 4 GiB: the largest step is `cc -O2` of a stage's C
# (2.7 GiB for the 10.8 MB RC C at aeaa34ef; the RC C is larger now), and the RC
# self-compile peaked at 1.3 GiB (docs/bootstrap-chain.md, "Measurements"). The
# collector's mode (`gc` below) needs 7 GiB: its stage 2 peaked at 6.3 GiB. This workflow
# is opt-in:
#
#   * nightly on `master` (the schedule below), and from "Run workflow";
#   * only on the self-hosted runner named by the repository variable
#     WIZ_RUNNER_HEAVY (docs/ci-runner.md); when the variable is unset the preflight job
#     says so and the fixpoint job is skipped, cleanly, instead of queueing for a runner
#     that does not exist;
#   * never on a pull request, and not part of `CI result`.
#
# The weekly `fixpoint` job in ci.yml still runs on ubuntu-latest as the fallback.
name: fixpoint

on:
  schedule:
    - cron: "41 3 * * *" # nightly: master's three-stage fixpoint on the heavy runner
  workflow_dispatch:
    inputs:
      stages:
        description: C stages to generate and compare (2 is the old check, 3 is the default)
        type: choice
        options: ["2", "3", "4"]
        default: "3"
      gc:
        description: Use the Boehm collector (--gc, 7 GiB) instead of reference counting
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fixpoint
  cancel-in-progress: false

defaults:
  run:
    shell: nix develop --command bash -eo pipefail {0}

env:
  CACHIX_NAME: badlydrawnwizards
  LAKE_CACHE_DIR: ${{ github.workspace }}/.lake/cache
  # The job's declared memory requirement, checked against MemAvailable before the run:
  # 4 GiB in RC mode (cc -O2 of a stage's C is the peak), 7 GiB with `gc` (stage 2's
  # self-compile has peaked at 6.3 GiB).
  WIZ_FIXPOINT_MEM_GIB: ${{ inputs.gc && '7' || '4' }}

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Is there a heavy runner?
        id: gate
        shell: bash
        env:
          RUNNER_LABEL: ${{ vars.WIZ_RUNNER_HEAVY }}
        run: |
          if [ -n "$RUNNER_LABEL" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "self-hosted runner: $RUNNER_LABEL (the fixpoint declares ${WIZ_FIXPOINT_MEM_GIB} GiB)"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=fixpoint skipped::WIZ_RUNNER_HEAVY is unset. The fixpoint needs a self-hosted runner with ${WIZ_FIXPOINT_MEM_GIB} GiB; set the repository variable to run it (docs/ci-runner.md)."
          fi

  fixpoint:
    name: fixpoint (self-hosted, ${{ inputs.gc && 'gc, 7' || 'rc, 4' }} GiB)
    needs: preflight
    if: needs.preflight.outputs.run == 'true'
    runs-on: ${{ vars.WIZ_RUNNER_HEAVY }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          cachix-name: ${{ env.CACHIX_NAME }}
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          lean: true
      - name: Check the memory requirement
        shell: bash
        run: |
          need_kib=$((WIZ_FIXPOINT_MEM_GIB * 1024 * 1024))
          avail_kib=$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)
          echo "MemAvailable: $((avail_kib / 1024)) MiB; the fixpoint declares ${WIZ_FIXPOINT_MEM_GIB} GiB"
          if [ "$avail_kib" -lt "$need_kib" ]; then
            echo "::error title=not enough memory::the fixpoint needs ${WIZ_FIXPOINT_MEM_GIB} GiB and this runner has $((avail_kib / 1024)) MiB available"
            exit 1
          fi
      - name: Cache the Lake build
        uses: actions/cache@v4
        with:
          path: .lake
          key: fixpoint-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('lakefile.lean', '**/*.lean', 'selfhost/*.wiz', 'lib/*.wiz') }}
          restore-keys: fixpoint-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Fixpoint
        env:
          STAGES: ${{ inputs.stages || '3' }}
          MODE: ${{ inputs.gc && '--gc' || '--rc' }}
        run: |
          args=(--stages "$STAGES" "$MODE")
          scripts/fixpoint.sh "${args[@]}" .lake/fixpoint 2>&1 | tee fixpoint.log
      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Bootstrap fixpoint (stages, ${WIZ_FIXPOINT_MEM_GIB} GiB)"
            echo
            echo '```'
            grep -E 'FIXPOINT|^mode:|^stage [0-9]|^   |^total|^timings|^FAILED' fixpoint.log || echo "(no result)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the C files of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fixpoint-artifacts
          path: |
            .lake/fixpoint/self*.c
            .lake/fixpoint/timings.tsv
            fixpoint.log
          if-no-files-found: ignore
          retention-days: 7
