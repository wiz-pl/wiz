name: ci
on:
  pull_request_target:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091f2e5f7f4b0f44f0d9a6c5c6e8a1b2c3d4e5
      - name: greet
        env:
          TITLE: ${{ github.event.issue.title }}
        run: echo "title: $TITLE"
      - uses: ./local-action
      - uses: docker://alpine@sha256:0123456789abcdef
